name: Galaxy Watch3 R08 Qt LinuxFB plugin package build

# Off-device BitBake build of QtBase only to inspect the ARM64 LinuxFB QPA plugin.
# Potentially expensive CI job, without flashable firmware.
# Full QtBase cross-compilation is manual-only. Fast AsteroidOS metadata CI
# remains automatic; do not launch another six-hour cold build on every edit.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Build runner (self-hosted requires a linux/x64/watch3-yocto runner)'
        type: choice
        required: true
        default: standard
        options:
          - standard
          - self-hosted

permissions:
  contents: read

concurrency:
  group: galaxy3-r08-qt-linuxfb-package
  cancel-in-progress: false

jobs:
  qtbase-linuxfb:
    # The self-hosted option must be explicitly configured by the repository owner.
    # A public GitHub Ubuntu runner previously built QtBase with ~86 GiB free;
    # always measure available disk before authorizing another cold rebuild.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","linux","x64","watch3-yocto"]') || 'ubuntu-22.04' }}
    timeout-minutes: 360
    steps:
      - name: Checkout Galaxy-3
        uses: actions/checkout@v4
      - name: Install metadata parsing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-packaging python3-setuptools gawk diffstat chrpath
      - name: Fetch the upstream AsteroidOS metadata layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src preflight-logs
          get_layer() {
            local dest="$1" url="$2" branch="$3"
            git clone --depth=1 --single-branch --branch "$branch" "$url" "src/$dest"
            printf '%s %s %s\n' "$dest" "$branch" "$(git -C "src/$dest" rev-parse HEAD)" | tee -a preflight-logs/upstream-commits.txt
          }
          get_layer oe-core https://github.com/openembedded/openembedded-core.git whinlatter
          get_layer oe-core/bitbake https://github.com/openembedded/bitbake.git 2.16
          # Reuse the same known-good core revisions as the successful R08 Linux rootfs.
          git -C src/oe-core fetch --depth=1 origin 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core checkout --detach 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core/bitbake fetch --depth=1 origin 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          git -C src/oe-core/bitbake checkout --detach 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          get_layer meta-openembedded https://github.com/openembedded/meta-openembedded.git whinlatter
          get_layer meta-qt6 https://code.qt.io/yocto/meta-qt6.git 6.11
          get_layer meta-smartphone https://github.com/shr-distribution/meta-smartphone.git whinlatter
          get_layer meta-clang https://github.com/kraj/meta-clang.git whinlatter
          get_layer meta-asteroid https://github.com/AsteroidOS/meta-asteroid.git master
          get_layer meta-asteroid-community https://github.com/AsteroidOS/meta-asteroid-community.git master
          get_layer meta-virtualization https://git.yoctoproject.org/meta-virtualization whinlatter
          git -C src/meta-openembedded checkout --detach f52f32952cb9717949f8bc3d3ccf6c4c5a59521f
          git -C src/meta-qt6 checkout --detach ec98b3ab1c8deeab9412ef6cbfd55729dc567b01
          git -C src/meta-smartphone checkout --detach 0ef4e8979fbf3403ff8aef977874496dc312d913
          git -C src/meta-clang checkout --detach cf20f8bd1366d41094c945597b95dd746e87b871
          # master may advance beyond this tested SHA on shallow clone.
          git -C src/meta-asteroid fetch --depth=1 origin 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid checkout --detach 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid-community checkout --detach f911d8900b2da887d1486416a8c16b8f8f15dd35
          git -C src/meta-virtualization checkout --detach 8f03a0cc8950ef5d5e4f11d9ae494946d1991e45
          { echo 'PINNED CORE:'; git -C src/oe-core rev-parse HEAD; git -C src/oe-core/bitbake rev-parse HEAD; } | tee -a preflight-logs/upstream-commits.txt
          echo 'AsteroidOS source layers downloaded; no kernel or operating system built.'
      - name: Configure actual AsteroidOS distro with R08 machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/conf preflight-logs
          cat > build/conf/bblayers.conf <<'EOF'
          BBPATH = "${TOPDIR}"
          BBLAYERS = " \
            ${TOPDIR}/../src/oe-core/meta \
            ${TOPDIR}/../src/meta-qt6 \
            ${TOPDIR}/../src/meta-asteroid \
            ${TOPDIR}/../src/meta-asteroid-community \
            ${TOPDIR}/../src/meta-openembedded/meta-oe \
            ${TOPDIR}/../src/meta-openembedded/meta-multimedia \
            ${TOPDIR}/../src/meta-openembedded/meta-gnome \
            ${TOPDIR}/../src/meta-openembedded/meta-networking \
            ${TOPDIR}/../src/meta-smartphone/meta-android \
            ${TOPDIR}/../src/meta-openembedded/meta-python \
            ${TOPDIR}/../src/meta-openembedded/meta-filesystems \
            ${TOPDIR}/../src/meta-clang \
            ${TOPDIR}/../src/meta-virtualization \
            ${TOPDIR}/../meta-noblesse \
          "
          EOF
          cat > build/conf/local.conf <<'EOF'
          MACHINE = "noblesse-r08"
          DISTRO = "asteroid"
          PACKAGE_CLASSES = "package_ipk"
          BB_NUMBER_THREADS = "3"
          PARALLEL_MAKE = "-j3"
          EOF
          # Persistent across runs on a dedicated self-hosted builder. Standard
          # GitHub-hosted runners discard these directories after each job.
          mkdir -p "$HOME/.cache/watch3-yocto/downloads" "$HOME/.cache/watch3-yocto/sstate-cache"
          printf 'DL_DIR = "%s/.cache/watch3-yocto/downloads"\n' "$HOME" >> build/conf/local.conf
          printf 'SSTATE_DIR = "%s/.cache/watch3-yocto/sstate-cache"\n' "$HOME" >> build/conf/local.conf
          # Ask BitBake to stop when storage is dangerously low.
          echo 'BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},2G,100K"' >> build/conf/local.conf

      - name: Restore signed Yocto sstate snapshot from free GitHub cache
        id: restore_sstate
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/watch3-yocto/sstate-snapshot
          key: galaxy3-r08-oe8751-qt611-v1-sstate-qtbase-${{ github.run_id }}
          restore-keys: |
            galaxy3-r08-oe8751-qt611-v1-sstate-

      - name: Load cached task signatures before any expensive compilation
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$HOME/.cache/watch3-yocto/sstate-snapshot"
          active="$HOME/.cache/watch3-yocto/sstate-cache"
          if [ -f "$snapshot/watch3-sstate-manifest.json" ]; then
            python3 tools/watch3_yocto_sstate_checkpoint.py restore "$snapshot" "$active"
          else
            echo 'CACHE MISS: no previous R08 Qt task archive exists'
          fi
          echo 'Cache is a best-effort optimization; BitBake still verifies task signatures'

      - name: Check host capacity before spending hours compiling
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME / $RUNNER_OS / $RUNNER_ARCH"
          echo '---- Storage ----'
          df -h "$GITHUB_WORKSPACE" "$HOME"
          echo '---- Memory ----'
          free -h
          echo '---- Cores ----'
          nproc
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          # Safety floor for this specific cold QtBase cross-compile, not the
          # 90GB Yocto full-image recommendation. A 14GB host is unsuitable.
          minimum_kib="$((24 * 1024 * 1024))"
          if [ "$available_kib" -lt "$minimum_kib" ]; then
            echo "::error title=Build host too small::Need at least 24 GiB free before starting the QtBase package build. Found $((available_kib / 1024 / 1024)) GiB. Use a storage-capable watch3-yocto self-hosted runner rather than repeat a cold six-hour build on this runner."
            exit 1
          fi

      - name: Run QtBase LinuxFB package-validator regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_watch3_qt_linuxfb_package.py -v
          python3 -m unittest discover -s tests -p test_watch3_qt_plugin_env.py -v
          python3 -m unittest discover -s tests -p test_watch3_yocto_sstate_checkpoint.py -v
      - name: Verify effective Watch3 Qt platform and launcher metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qt-logs
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e qtbase > "$GITHUB_WORKSPACE/qt-logs/qtbase-env.tmp"
          bitbake -e asteroid-launcher > "$GITHUB_WORKSPACE/qt-logs/launcher-env.tmp"
          python3 "$GITHUB_WORKSPACE/tools/check_watch3_qt_plugin_env.py" \
            "$GITHUB_WORKSPACE/qt-logs/qtbase-env.tmp" \
            "$GITHUB_WORKSPACE/qt-logs/launcher-env.tmp"
          rm -f "$GITHUB_WORKSPACE/qt-logs/qtbase-env.tmp" "$GITHUB_WORKSPACE/qt-logs/launcher-env.tmp"
          df -h "$GITHUB_WORKSPACE"
      - name: Build only QtBase through package staging
        id: qtbase_build
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          # Live heartbeat and host/task snapshots so future slowdowns are
          # distinguishable from a stalled build, even before logs are archived.
          (
            while sleep 180; do
              echo "::group::Watch3 QtBase build health $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              df -h "$GITHUB_WORKSPACE" "$HOME" || true
              free -h || true
              ps -eo pid,etime,%cpu,%mem,args --sort=-%cpu | head -n 12 || true
              if [ -f "$GITHUB_WORKSPACE/qt-logs/qtbase-package-build.log" ]; then
                tail -n 12 "$GITHUB_WORKSPACE/qt-logs/qtbase-package-build.log" || true
              fi
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # Keep room before GitHub's six-hour job cap to checkpoint sstate,
          # even if cold QtBase is not yet finished.
          timeout --signal=TERM --kill-after=15s 18000s \
            bitbake -c package qtbase 2>&1 | tee "$GITHUB_WORKSPACE/qt-logs/qtbase-package-build.log"
      - name: Inspect actual packaged R08 LinuxFB QPA binary
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e qtbase > "$GITHUB_WORKSPACE/qt-logs/qtbase-env.tmp"
          pkgdest="$(awk -F'"' '$1=="PKGDEST=" {print $2}' "$GITHUB_WORKSPACE/qt-logs/qtbase-env.tmp" | tail -n 1)"
          rm -f "$GITHUB_WORKSPACE/qt-logs/qtbase-env.tmp"
          test -n "$pkgdest" && test -d "$pkgdest" || {
            echo "::error::QtBase package staging directory is missing: $pkgdest"
            exit 1
          }
          python3 "$GITHUB_WORKSPACE/tools/validate_watch3_qt_linuxfb_package.py" "$pkgdest"
          plugin="$(find "$pkgdest/qtbase-plugins" -type f -path '*/plugins/platforms/libqlinuxfb.so' -print -quit)"
          test -n "$plugin"
          sha256sum "$plugin" | tee "$GITHUB_WORKSPACE/qt-logs/qt-linuxfb-plugin-sha256.txt"
          file "$plugin" | tee "$GITHUB_WORKSPACE/qt-logs/qt-linuxfb-plugin-architecture.txt"
          # Preserve the real compiled ARM64 plugin, not just its hash.
          # The successful 2026-10-21 run only saved text diagnostics,
          # making the six-hour compiler work impossible to reuse later.
          mkdir -p "$GITHUB_WORKSPACE/qt-logs/arm64-platform-plugin"
          cp -L "$plugin" "$GITHUB_WORKSPACE/qt-logs/arm64-platform-plugin/libqlinuxfb.so"
          cmp -s "$plugin" "$GITHUB_WORKSPACE/qt-logs/arm64-platform-plugin/libqlinuxfb.so" || {
            echo "::error::Archived ARM64 plugin differs from package staging"
            exit 1
          }
          file "$GITHUB_WORKSPACE/qt-logs/arm64-platform-plugin/libqlinuxfb.so" |
            grep -Eq 'ELF 64-bit LSB shared object, ARM aarch64' || {
              echo "::error::Captured artifact is not an ARM64 LinuxFB plugin"
              exit 1
            }
          sha256sum "$GITHUB_WORKSPACE/qt-logs/arm64-platform-plugin/libqlinuxfb.so" |
            tee "$GITHUB_WORKSPACE/qt-logs/arm64-platform-plugin/SHA256SUMS"
          echo 'PASS: actual ARM64 LinuxFB .so retained for off-device package integration'
          echo 'NOT TESTED: target QtWayland compositor, final rootfs, device framebuffer or boot'
      - name: Prepare bounded portable R08 Yocto task checkpoint
        id: snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sstate="$HOME/.cache/watch3-yocto/sstate-cache"
          snapshot="$HOME/.cache/watch3-yocto/sstate-snapshot"
          if [ ! -d "$sstate" ] || [ -z "$(find "$sstate" -type f -name '*.tar.zst' -print -quit)" ]; then
            echo 'No complete sstate task archives exist; no cache checkpoint saved'
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          free_kib="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          if (( free_kib < 10 * 1024 * 1024 )); then
            echo 'Less than 10 GiB free disk; skip checkpoint copy to protect runner'
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/tools/watch3_yocto_sstate_checkpoint.py" \
            checkpoint "$sstate" "$snapshot" --max-mib 4096
          python3 - "$snapshot/watch3-sstate-manifest.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          info = json.loads(Path(sys.argv[1]).read_text())
          print(f"Selected {info['archive_pairs']} signed sstate archive pairs; "
                f"snapshot size {info['bytes'] / 1024**3:.2f} GiB")
          with Path(sys.argv[2]).open("a") as stream:
              stream.write(f"present={'true' if info['archive_pairs'] else 'false'}\n")
          PY

      - name: Save completed R08 Qt task state on success or bounded build failure
        if: always() && steps.snapshot.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/watch3-yocto/sstate-snapshot
          key: galaxy3-r08-oe8751-qt611-v1-sstate-qtbase-${{ github.run_id }}

      - name: Archive Qt plugin and build diagnostics (including real ARM64 binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-qt-linuxfb-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          # Qt build artifacts now include the actual ARM64 LinuxFB .so.
          # GitHub-hosted runner storage is ephemeral; keep reusable output.
          path: qt-logs/
