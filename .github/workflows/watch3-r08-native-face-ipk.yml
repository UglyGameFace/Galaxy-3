name: UgLy|OS R08 genuine bounded native Yocto watchface IPK

# Dependency-aware native package_write_ipk, no -b. Fail closed on Qt graph.
# R08 data-only rdeptask exception is accepted ONLY if real IPK Depends is intact.
# OFF-DEVICE ONLY: no boot, recovery or flashing validation.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/watch3-r08-native-face-ipk.yml'
      - 'tools/validate_watch3_native_face_ipk.py'
      - 'tests/test_watch3_native_face_ipk.py'
      - 'meta-noblesse/recipes-asteroid/watch3-faces/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy3-r08-native-face-ipk
  cancel-in-progress: false

jobs:
  asteroid-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout Galaxy-3
        uses: actions/checkout@v4
      - name: Check free runner capacity before fetching pinned sources
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          free -h
          disk_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          if (( disk_kib < 30 * 1024 * 1024 || mem_kib < 4 * 1024 * 1024 )); then
            echo "::error title=Runner capacity below package gate::Need >=30 GiB free disk and >=4 GiB RAM for small metadata package task. No build started."
            exit 1
          fi
          echo 'PASS: available free runner supports bounded machine configuration package stage'
      - name: Install metadata parsing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-packaging python3-setuptools gawk diffstat chrpath zstd binutils
      - name: Validate native IPK archive reader before upstream downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_watch3_native_face_ipk.py
          python3 -m unittest discover -s tests -p 'test_watch3_native_face_ipk.py' -v
          python3 -m unittest discover -s tests -p 'test_uglyos_face_package.py' -v
      - name: Fetch the upstream AsteroidOS metadata layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src preflight-logs
          get_layer() {
            local dest="$1" url="$2" branch="$3"
            git clone --depth=1 --single-branch --branch "$branch" "$url" "src/$dest"
            printf '%s %s %s\n' "$dest" "$branch" "$(git -C "src/$dest" rev-parse HEAD)" | tee -a preflight-logs/upstream-commits.txt
          }
          get_layer oe-core https://github.com/openembedded/openembedded-core.git whinlatter
          get_layer oe-core/bitbake https://github.com/openembedded/bitbake.git 2.16
          # Reuse the same known-good core revisions as the successful R08 Linux rootfs.
          git -C src/oe-core fetch --depth=1 origin 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core checkout --detach 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core/bitbake fetch --depth=1 origin 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          git -C src/oe-core/bitbake checkout --detach 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          get_layer meta-openembedded https://github.com/openembedded/meta-openembedded.git whinlatter
          get_layer meta-qt6 https://code.qt.io/yocto/meta-qt6.git 6.11
          get_layer meta-smartphone https://github.com/shr-distribution/meta-smartphone.git whinlatter
          get_layer meta-clang https://github.com/kraj/meta-clang.git whinlatter
          get_layer meta-asteroid https://github.com/AsteroidOS/meta-asteroid.git master
          get_layer meta-asteroid-community https://github.com/AsteroidOS/meta-asteroid-community.git master
          get_layer meta-virtualization https://git.yoctoproject.org/meta-virtualization whinlatter
          git -C src/meta-openembedded checkout --detach f52f32952cb9717949f8bc3d3ccf6c4c5a59521f
          git -C src/meta-qt6 checkout --detach ec98b3ab1c8deeab9412ef6cbfd55729dc567b01
          git -C src/meta-smartphone checkout --detach 0ef4e8979fbf3403ff8aef977874496dc312d913
          git -C src/meta-clang checkout --detach cf20f8bd1366d41094c945597b95dd746e87b871
          # master can advance after the shallow clone; explicitly fetch our tested commit.
          git -C src/meta-asteroid fetch --depth=1 origin 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid checkout --detach 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid-community checkout --detach f911d8900b2da887d1486416a8c16b8f8f15dd35
          git -C src/meta-virtualization checkout --detach 8f03a0cc8950ef5d5e4f11d9ae494946d1991e45
          { echo 'PINNED CORE:'; git -C src/oe-core rev-parse HEAD; git -C src/oe-core/bitbake rev-parse HEAD; } | tee -a preflight-logs/upstream-commits.txt
          echo 'AsteroidOS source layers downloaded; no kernel or operating system built.'
      - name: Configure actual AsteroidOS distro with R08 machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/conf preflight-logs
          cat > build/conf/bblayers.conf <<'EOF'
          BBPATH = "${TOPDIR}"
          BBLAYERS = " \
            ${TOPDIR}/../src/oe-core/meta \
            ${TOPDIR}/../src/meta-qt6 \
            ${TOPDIR}/../src/meta-asteroid \
            ${TOPDIR}/../src/meta-asteroid-community \
            ${TOPDIR}/../src/meta-openembedded/meta-oe \
            ${TOPDIR}/../src/meta-openembedded/meta-multimedia \
            ${TOPDIR}/../src/meta-openembedded/meta-gnome \
            ${TOPDIR}/../src/meta-openembedded/meta-networking \
            ${TOPDIR}/../src/meta-smartphone/meta-android \
            ${TOPDIR}/../src/meta-openembedded/meta-python \
            ${TOPDIR}/../src/meta-openembedded/meta-filesystems \
            ${TOPDIR}/../src/meta-clang \
            ${TOPDIR}/../src/meta-virtualization \
            ${TOPDIR}/../meta-noblesse \
          "
          EOF
          cat > build/conf/local.conf <<'EOF'
          MACHINE = "noblesse-r08"
          DISTRO = "asteroid"
          PACKAGE_CLASSES = "package_ipk"
          BB_NUMBER_THREADS = "3"
          PARALLEL_MAKE = "-j3"
          EOF
          echo 'BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},8G,100K"' >> build/conf/local.conf
      - name: Check that inode safety limit fits this free runner
        shell: bash
        run: |
          set -euo pipefail
          # The previous 200M free-inode threshold meant 209,715,200
          # inodes and stopped the build with ~18 million actually free.
          df -h "$GITHUB_WORKSPACE"
          df -i "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import os
          config = Path('build/conf/local.conf').read_text()
          limits = [line for line in config.splitlines() if line.startswith('BB_DISKMON_DIRS = ')]
          assert len(limits) == 1 and limits[0].endswith(',8G,100K"'), 'Unsafe BitBake disk/inode limit'
          st = os.statvfs('build')
          disk_gib = st.f_bavail * st.f_frsize / 1024**3
          print(f'Free disk: {disk_gib:.1f} GiB; stop limit: 8 GiB')
          assert disk_gib >= 20, 'Free disk too low for this build'
          if st.f_files > 0 and st.f_favail >= 0:
              print(f'Free inodes: {st.f_favail:,}; stop limit: 102,400')
              assert st.f_favail >= 500_000, 'Free inodes too low for this build'
          print('PASS: BitBake inode guard is realistic and filesystem has headroom')
          PY
      - name: Check actual R08 runtime dependency and budget genuine IPK graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/native-face-logs"
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e watch3-faces > "$GITHUB_WORKSPACE/native-face-logs/face.env.tmp"
          bitbake -e asteroid-image > "$GITHUB_WORKSPACE/native-face-logs/image.env.tmp"
          python3 "$GITHUB_WORKSPACE/tools/validate_uglyos_face_package.py" metadata \
            "$GITHUB_WORKSPACE/native-face-logs/face.env.tmp" \
            "$GITHUB_WORKSPACE/native-face-logs/image.env.tmp"
          python3 - "$GITHUB_WORKSPACE/native-face-logs/face.env.tmp" <<'PY'
          from pathlib import Path
          import sys
          import os
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'tools'))
          from validate_uglyos_face_package import variables
          info = variables(Path(sys.argv[1]))
          assert info.get("RDEPENDS:watch3-faces") == "asteroid-launcher"
          assert info.get("PACKAGE_ARCH") == "noblesse_r08"
          print("PASS: real watch3-faces runtime dependency is preserved")
          PY
          rm -f "$GITHUB_WORKSPACE/native-face-logs/"*.env.tmp
          timeout --signal=TERM --kill-after=5s 900s \
            bitbake -g -c package_write_ipk watch3-faces 2>&1 |
            tee "$GITHUB_WORKSPACE/native-face-logs/01-native-ipk-graph.log"
          cp pn-buildlist "$GITHUB_WORKSPACE/native-face-logs/01-native-ipk-pn-buildlist.txt"
          cp task-depends.dot "$GITHUB_WORKSPACE/native-face-logs/01-native-ipk-task-depends.dot"
          python3 - "$GITHUB_WORKSPACE/native-face-logs" "$GITHUB_STEP_SUMMARY" <<'PY'
          from pathlib import Path
          import re
          import sys
          folder, summary = map(Path, sys.argv[1:])
          recipes = set((folder / "01-native-ipk-pn-buildlist.txt").read_text().splitlines())
          graph = (folder / "01-native-ipk-task-depends.dot").read_text()
          tasks = set(re.findall(r'"([^"]+\.do_[^"]+)"', graph))
          assert "watch3-faces" in recipes and tasks, "Empty or wrong task graph"
          assert '"watch3-faces.do_package_write_ipk" -> "asteroid-launcher.do_packagedata"' not in graph, (
              "Runtime packagedata edge still expands the launcher build")
          forbidden = {"qtbase", "qtbase-native", "qtdeclarative", "qtdeclarative-native",
                       "qttools-native", "qtwayland", "asteroid-launcher", "asteroid-image"}
          blocked = sorted(recipes & forbidden)
          assert not blocked, f"Native IPK graph has forbidden expensive recipes: {blocked}"
          assert len(tasks) <= 800, f"Native IPK task count over safety cap: {len(tasks)}"
          message = f"PASS: native IPK graph has {len(recipes)} recipes / {len(tasks)} tasks"
          print(message)
          (folder / "02-task-budget.txt").write_text(message + "\n")
          with summary.open("a") as out:
              out.write("## Bounded native package_write_ipk graph\n")
              out.write(f"- {len(recipes)} recipes, {len(tasks)} tasks (cap 800)\n")
          PY

      - name: Build real dependency-aware Yocto IPK without -b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/native-face-logs"
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          timeout --signal=TERM --kill-after=5s 2700s \
            bitbake -c package_write_ipk watch3-faces 2>&1 |
            tee "$GITHUB_WORKSPACE/native-face-logs/03-native-ipk-build.log"

      - name: Verify real Yocto IPK, control dependency and package split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/native-face-logs/native-ipk"
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e watch3-faces > "$GITHUB_WORKSPACE/native-face-logs/package.env.tmp"
          python3 "$GITHUB_WORKSPACE/tools/validate_uglyos_face_package.py" packaged \
            "$GITHUB_WORKSPACE/native-face-logs/package.env.tmp" \
            "$GITHUB_WORKSPACE/meta-noblesse/recipes-asteroid/watch3-faces/watch3-faces" |
            tee "$GITHUB_WORKSPACE/native-face-logs/04-real-package-split.txt"
          pkgdir="$GITHUB_WORKSPACE/build/tmp/deploy/ipk"
          test -d "$pkgdir"
          count="$(find "$pkgdir" -type f -name 'watch3-faces_*.ipk' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error title=Missing native Yocto IPK::Expected one IPK, found $count"
            exit 1
          fi
          archive="$(find "$pkgdir" -type f -name 'watch3-faces_*.ipk' -print -quit)"
          python3 "$GITHUB_WORKSPACE/tools/validate_watch3_native_face_ipk.py" \
            "$GITHUB_WORKSPACE/native-face-logs/package.env.tmp" \
            "$GITHUB_WORKSPACE/meta-noblesse/recipes-asteroid/watch3-faces/watch3-faces" \
            "$archive" |
            tee "$GITHUB_WORKSPACE/native-face-logs/05-verified-native-ipk.txt"
          cp "$archive" "$GITHUB_WORKSPACE/native-face-logs/native-ipk/"
          sha256sum "$GITHUB_WORKSPACE"/native-face-logs/native-ipk/*.ipk |
            tee "$GITHUB_WORKSPACE/native-face-logs/06-native-ipk.sha256"
          rm -f "$GITHUB_WORKSPACE/native-face-logs/package.env.tmp"
          {
            echo '## Real Yocto IPK verified (off-device)'
            echo '- Six source assets match actual native IPK payload and package split'
            echo '- Native control must contain Depends: asteroid-launcher'
            echo '- NOT TESTED: opkg installation, firmware rootfs, boot, stock recovery, flashing'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload genuine Yocto IPK marked OFFLINE-NOT-FLASHABLE
        uses: actions/upload-artifact@v4
        with:
          name: REAL-YOCTO-OFFLINE-NOT-FLASHABLE-watch3-faces
          retention-days: 7
          if-no-files-found: error
          path: native-face-logs/native-ipk/*.ipk

      - name: Upload bounded native IPK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-native-ipk-build-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: native-face-logs/
