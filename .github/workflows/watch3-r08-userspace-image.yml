name: Galaxy Watch3 R08 userspace research image

# Builds an offline Linux filesystem only. NOT a flashable image or a boot test.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch3-r08-userspace-image.yml'
      - 'meta-noblesse/recipes-core/images/noblesse-research-image.bb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy3-r08-userspace-research
  cancel-in-progress: false

jobs:
  userspace-rootfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Check out Galaxy-3 research source
        uses: actions/checkout@v4

      - name: Install OpenEmbedded host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git chrpath build-essential cpio diffstat gawk file \
            libssl-dev texinfo python3 python3-packaging python3-setuptools \
            wget zstd liblz4-tool bc bison flex xz-utils unzip zip locales
          df -h .

      - name: Fetch pinned OpenEmbedded sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --depth=1 -b whinlatter https://github.com/openembedded/openembedded-core.git oe-core
          git -C oe-core fetch --no-tags --depth=1 origin 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C oe-core checkout --detach 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git clone --no-tags --depth=1 -b 2.16 https://github.com/openembedded/bitbake.git oe-core/bitbake
          git -C oe-core/bitbake fetch --no-tags --depth=1 origin 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          git -C oe-core/bitbake checkout --detach 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          test "$(git -C oe-core rev-parse HEAD)" = 8751ec83421192fc0f8495fb95798f9eb7be77a0
          test "$(git -C oe-core/bitbake rev-parse HEAD)" = 713fbbdb9ecc195ceb2216a2345e0d79dbee2135

      - name: Restore shared downloads and build state
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: galaxy3-r08-oe-whinlatter-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            galaxy3-r08-oe-whinlatter-${{ runner.os }}-

      - name: Configure R08 research build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/conf image-logs
          cat > build/conf/bblayers.conf <<'EOF'
          BBPATH = "${TOPDIR}"
          BBLAYERS = "${TOPDIR}/../oe-core/meta ${TOPDIR}/../meta-noblesse"
          EOF
          cat > build/conf/local.conf <<'EOF'
          MACHINE = "noblesse-r08"
          DISTRO = "nodistro"
          PACKAGE_CLASSES = "package_ipk"
          BB_NUMBER_THREADS = "3"
          PARALLEL_MAKE = "-j3"
          DL_DIR = "${TOPDIR}/downloads"
          SSTATE_DIR = "${TOPDIR}/sstate-cache"
          EOF
          {
            echo 'NON-FLASHABLE ROOTFS EXPERIMENT, NOT ASTEROIDOS OR SIGNED FIRMWARE'
            echo 'Target: SM-R840X, Exynos9110, R08'
            echo 'Stock firmware R840XXXU1AUA2 not proven compatible with public kernel'
            echo 'OE-Core 8751ec83421192fc0f8495fb95798f9eb7be77a0 / BitBake 713fbbdb9ecc195ceb2216a2345e0d79dbee2135'
            df -h .
          } | tee image-logs/context.txt

      - name: Verify 4.9 kernel ABI target and image metadata
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e glibc > "$GITHUB_WORKSPACE/image-logs/glibc-env.txt"
          grep -Fxq 'OLDEST_KERNEL="4.9.59"' "$GITHUB_WORKSPACE/image-logs/glibc-env.txt" || {
            echo '::error::glibc is not configured for this Linux 4.9.59 kernel'
            exit 1
          }
          bitbake -e noblesse-research-image > "$GITHUB_WORKSPACE/image-logs/image-env.txt"
          grep -Fxq 'MACHINE="noblesse-r08"' "$GITHUB_WORKSPACE/image-logs/image-env.txt" || {
            echo '::error::Unexpected machine in research-image recipe'
            exit 1
          }
          # BitBake may append ext4 via MACHINE as well as the image recipe.
          # Require a whole ext4 format token rather than exact string equality.
          grep '^IMAGE_FSTYPES=' "$GITHUB_WORKSPACE/image-logs/image-env.txt" | tee "$GITHUB_WORKSPACE/image-logs/image-formats.txt"
          grep -Eq '^IMAGE_FSTYPES="(.*[[:space:]])?ext4([[:space:]].*)?"

      - name: Deploy experimental reference kernel through BitBake
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -c deploy linux-noblesse 2>&1 | tee "$GITHUB_WORKSPACE/image-logs/01-kernel-deploy.log"
          echo 'Kernel deploy succeeded. No boot format or signing was validated.'

      - name: Build minimal R08 Linux userspace filesystem
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake noblesse-research-image 2>&1 | tee "$GITHUB_WORKSPACE/image-logs/02-rootfs-build.log"
          echo 'Research rootfs built. This is NOT a bootable/watch-flashable AsteroidOS image.'

      - name: Inventory outputs and preserve task errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-logs/task-logs image-logs/outputs
          if [ -d build/tmp/deploy/images/noblesse-r08 ]; then
            find build/tmp/deploy/images/noblesse-r08 -maxdepth 1 -printf '%f %s bytes\n' | tee image-logs/deployed-files.txt
            find build/tmp/deploy/images/noblesse-r08 -maxdepth 1 -type f \
              \( -name '*noblesse-research-image*.ext4' -o -name 'Image*' -o -name '*r08.dtb' \) \
              -exec cp -n '{}' image-logs/outputs/ \; || true
          fi
          find build/tmp/work -type f -name 'log.do_*.*' \
            \( -path '*/linux-noblesse/*' -o -path '*/noblesse-research-image/*' \) \
            -print -exec sh -c 'cp "$1" "image-logs/task-logs/$(basename "$(dirname "$1")")-$(basename "$1")"' sh '{}' \; 2>/dev/null || true
          df -h . || true

      - name: Upload off-device research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-userspace-research-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            image-logs/context.txt
            image-logs/abi-check.txt
            image-logs/image-formats.txt
            image-logs/01-kernel-deploy.log
            image-logs/02-rootfs-build.log
            image-logs/deployed-files.txt
            image-logs/task-logs/
            image-logs/outputs/
 "$GITHUB_WORKSPACE/image-logs/image-env.txt" || {
            echo '::error::No plain ext4 image format selected'
            exit 1
          }
          echo 'R08 machine, 4.9.59 ABI, and offline ext4 image metadata validated' | tee "$GITHUB_WORKSPACE/image-logs/abi-check.txt"

      - name: Deploy experimental reference kernel through BitBake
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -c deploy linux-noblesse 2>&1 | tee "$GITHUB_WORKSPACE/image-logs/01-kernel-deploy.log"
          echo 'Kernel deploy succeeded. No boot format or signing was validated.'

      - name: Build minimal R08 Linux userspace filesystem
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake noblesse-research-image 2>&1 | tee "$GITHUB_WORKSPACE/image-logs/02-rootfs-build.log"
          echo 'Research rootfs built. This is NOT a bootable/watch-flashable AsteroidOS image.'

      - name: Inventory outputs and preserve task errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-logs/task-logs image-logs/outputs
          if [ -d build/tmp/deploy/images/noblesse-r08 ]; then
            find build/tmp/deploy/images/noblesse-r08 -maxdepth 1 -printf '%f %s bytes\n' | tee image-logs/deployed-files.txt
            find build/tmp/deploy/images/noblesse-r08 -maxdepth 1 -type f \
              \( -name '*noblesse-research-image*.ext4' -o -name 'Image*' -o -name '*r08.dtb' \) \
              -exec cp -n '{}' image-logs/outputs/ \; || true
          fi
          find build/tmp/work -type f -name 'log.do_*.*' \
            \( -path '*/linux-noblesse/*' -o -path '*/noblesse-research-image/*' \) \
            -print -exec sh -c 'cp "$1" "image-logs/task-logs/$(basename "$(dirname "$1")")-$(basename "$1")"' sh '{}' \; 2>/dev/null || true
          df -h . || true

      - name: Upload off-device research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-userspace-research-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            image-logs/context.txt
            image-logs/abi-check.txt
            image-logs/01-kernel-deploy.log
            image-logs/02-rootfs-build.log
            image-logs/deployed-files.txt
            image-logs/task-logs/
            image-logs/outputs/
