name: Watch3 R08 graphics rootfs validator regression

# Fast host-side regression only. NEVER builds Qt, Yocto or an ARM64 image.
on:
  push:
    branches: [main]
    paths:
      - 'tools/validate_watch3_graphics_rootfs.py'
      - 'tests/test_watch3_graphics_rootfs.py'
      - '.github/workflows/watch3-r08-graphical-rootfs.yml'
      - '.github/workflows/watch3-r08-qt-linuxfb-package.yml'
      - '.github/workflows/watch3-r08-graphics-validator-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootfs-validator-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout Galaxy-3
        uses: actions/checkout@v4
      - name: Run actual ELF, image presence and package-manifest regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_watch3_graphics_rootfs.py
          python3 -m unittest discover -s tests -p test_watch3_graphics_rootfs.py -v
      - name: Ensure full graphical rootfs build cannot run on push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/watch3-r08-graphical-rootfs.yml")
          text = p.read_text()
          required = (
              "on:\n  workflow_dispatch:",
              "runs-on: [self-hosted, linux, x64, watch3-yocto]",
              "inputs.confirm == 'BUILD_OFF_DEVICE_ROOTFS_ONLY'",
              "bitbake -c rootfs asteroid-image",
              "validate_watch3_graphics_rootfs.py",
              "IMAGE_ROOTFS",
              "IMAGE_MANIFEST",
              "120 * 1024 * 1024",
              "12 * 1024 * 1024",
              "Archive diagnostics only, never the rootfs or firmware",
          )
          for item in required:
              assert item in text, f"Missing rootfs workflow safety requirement: {item}"
          assert "\n  push:" not in text, "Expensive graphical rootfs workflow must not auto-run"
          assert not any(line.strip().startswith("runs-on:") and "ubuntu-22.04" in line for line in text.splitlines()), "Expensive build cannot target standard hosted runner"
          assert "          - standard" not in text, "Dead-end runner choice should stay removed"
          assert "bitbake asteroid-image 2>&1" not in text, "Must stop at do_rootfs"
          assert 'rm -f "$GITHUB_WORKSPACE/rootfs-logs/"*.env' in text, "Rootfs env cleanup must use workspace path after BitBake changes cwd"
          assert 'bitbake -n asteroid-image 2>&1 | tee "$GITHUB_WORKSPACE/rootfs-logs/00-dry-run.log"' in text, "Rootfs dry-run log must use absolute workspace path"
          qt = Path(".github/workflows/watch3-r08-qt-linuxfb-package.yml").read_text()
          assert "  workflow_dispatch:" in qt and "\\n  push:" not in qt, "Six-hour QtBase build must stay manual"
          for required_qt in (
              'arm64-platform-plugin/libqlinuxfb.so',
              'cp -L "$plugin"',
              'cmp -s "$plugin"',
              'arm64-platform-plugin/SHA256SUMS',
              'git -C src/meta-asteroid fetch --depth=1 origin 1af66a6188f7909303cfcec779c8475be1bc4679',
          ):
              assert required_qt in qt, f"QtBase artifact or pinned checkout safeguard missing: {required_qt}"
          assert "never the binary" not in qt, "QtBase workflow must preserve compiled binary"
          print("PASS: future LinuxFB ARM64 binary is archived; no build was launched")
          print("PASS: manual-only graphical rootfs workflow and post-build validator are wired")
          PY
