name: R840X Wireless Download ODIN magic-only transport (NO WATCH)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/watch3_r840x_netodin_magic_only.py'
      - 'tools/audit_watch3_r840x_odin_offline.py'
      - 'tests/test_watch3_r840x_odin_offline.py'
      - 'docs/watch3-r840x-odin-offline-risk-classification.md'
      - 'tools/watch3_r840x_ap_network_preflight.py'
      - 'tests/test_watch3_r840x_ap_network_preflight.py'
      - 'tests/test_watch3_r840x_netodin_magic_only.py'
      - 'docs/watch3-r840x-wireless-download-magic.md'
      - '.github/workflows/watch3-r840x-netodin-magic-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-byte-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prove exact magic-only contract on local TCP with no flash/session commands
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_watch3_r840x_netodin_magic_only.py -v
          python3 -m unittest discover -s tests -p test_watch3_r840x_odin_offline.py -v
          python3 -m unittest discover -s tests -p test_watch3_r840x_ap_network_preflight.py -v
          python3 -m py_compile tools/watch3_r840x_netodin_magic_only.py tools/watch3_r840x_ap_network_preflight.py tools/audit_watch3_r840x_odin_offline.py
          python3 tools/audit_watch3_r840x_odin_offline.py --report /tmp/r840x-odin-offline-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/r840x-odin-offline-audit.json').read_text())
          assert data['new_live_command_authorized'] is False
          assert data['network_packets_sent'] is False
          assert all(not entry['watch_allowed_now'] for entry in data['commands'])
          assert all(entry['expected_wire_bytes'] == 1024 for entry in data['commands'][1:])
          print('PASS: no new live Odin commands permitted')
          PY
          git diff --check
          echo 'PASS: local-only Wi-Fi inspection, explicit local subnet binding and loopback peer contract'
          echo 'NO-GO: no 1024-byte Odin commands have been tested on physical R840X; only four-byte magic handshake proven'
