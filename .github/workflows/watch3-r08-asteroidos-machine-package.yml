name: Galaxy Watch3 R08 AsteroidOS machine package

# Build only the small upstream AsteroidOS machine-identity package on the R08 machine.
# Never produces signed, bootable or flashable firmware.
# Bounded small-package job on the free public-repo GitHub runner.
# Changes to the R08 identity or this workflow trigger it; never builds Qt/firmware.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch3-r08-asteroidos-machine-package.yml'
      - 'meta-noblesse/conf/machine/noblesse-r08.conf'
      - 'tools/validate_asteroid_machine_config.py'
      - 'meta-noblesse/recipes-asteroid/asteroid-machine-config/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy3-asteroidos-machine-package
  cancel-in-progress: false

jobs:
  asteroid-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Galaxy-3
        uses: actions/checkout@v4
      - name: Check free runner capacity before fetching pinned sources
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          free -h
          disk_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          if (( disk_kib < 30 * 1024 * 1024 || mem_kib < 4 * 1024 * 1024 )); then
            echo "::error title=Runner capacity below package gate::Need >=30 GiB free disk and >=4 GiB RAM for small metadata package task. No build started."
            exit 1
          fi
          echo 'PASS: available free runner supports bounded machine configuration package stage'
      - name: Install metadata parsing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-packaging python3-setuptools gawk diffstat chrpath
      - name: Fetch the upstream AsteroidOS metadata layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src preflight-logs
          get_layer() {
            local dest="$1" url="$2" branch="$3"
            git clone --depth=1 --single-branch --branch "$branch" "$url" "src/$dest"
            printf '%s %s %s\n' "$dest" "$branch" "$(git -C "src/$dest" rev-parse HEAD)" | tee -a preflight-logs/upstream-commits.txt
          }
          get_layer oe-core https://github.com/openembedded/openembedded-core.git whinlatter
          get_layer oe-core/bitbake https://github.com/openembedded/bitbake.git 2.16
          # Reuse the same known-good core revisions as the successful R08 Linux rootfs.
          git -C src/oe-core fetch --depth=1 origin 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core checkout --detach 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core/bitbake fetch --depth=1 origin 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          git -C src/oe-core/bitbake checkout --detach 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          get_layer meta-openembedded https://github.com/openembedded/meta-openembedded.git whinlatter
          get_layer meta-qt6 https://code.qt.io/yocto/meta-qt6.git 6.11
          get_layer meta-smartphone https://github.com/shr-distribution/meta-smartphone.git whinlatter
          get_layer meta-clang https://github.com/kraj/meta-clang.git whinlatter
          get_layer meta-asteroid https://github.com/AsteroidOS/meta-asteroid.git master
          get_layer meta-asteroid-community https://github.com/AsteroidOS/meta-asteroid-community.git master
          get_layer meta-virtualization https://git.yoctoproject.org/meta-virtualization whinlatter
          git -C src/meta-openembedded checkout --detach f52f32952cb9717949f8bc3d3ccf6c4c5a59521f
          git -C src/meta-qt6 checkout --detach ec98b3ab1c8deeab9412ef6cbfd55729dc567b01
          git -C src/meta-smartphone checkout --detach 0ef4e8979fbf3403ff8aef977874496dc312d913
          git -C src/meta-clang checkout --detach cf20f8bd1366d41094c945597b95dd746e87b871
          git -C src/meta-asteroid checkout --detach 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid-community checkout --detach f911d8900b2da887d1486416a8c16b8f8f15dd35
          git -C src/meta-virtualization checkout --detach 8f03a0cc8950ef5d5e4f11d9ae494946d1991e45
          { echo 'PINNED CORE:'; git -C src/oe-core rev-parse HEAD; git -C src/oe-core/bitbake rev-parse HEAD; } | tee -a preflight-logs/upstream-commits.txt
          echo 'AsteroidOS source layers downloaded; no kernel or operating system built.'
      - name: Configure actual AsteroidOS distro with R08 machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/conf preflight-logs
          cat > build/conf/bblayers.conf <<'EOF'
          BBPATH = "${TOPDIR}"
          BBLAYERS = " \
            ${TOPDIR}/../src/oe-core/meta \
            ${TOPDIR}/../src/meta-qt6 \
            ${TOPDIR}/../src/meta-asteroid \
            ${TOPDIR}/../src/meta-asteroid-community \
            ${TOPDIR}/../src/meta-openembedded/meta-oe \
            ${TOPDIR}/../src/meta-openembedded/meta-multimedia \
            ${TOPDIR}/../src/meta-openembedded/meta-gnome \
            ${TOPDIR}/../src/meta-openembedded/meta-networking \
            ${TOPDIR}/../src/meta-smartphone/meta-android \
            ${TOPDIR}/../src/meta-openembedded/meta-python \
            ${TOPDIR}/../src/meta-openembedded/meta-filesystems \
            ${TOPDIR}/../src/meta-clang \
            ${TOPDIR}/../src/meta-virtualization \
            ${TOPDIR}/../meta-noblesse \
          "
          EOF
          cat > build/conf/local.conf <<'EOF'
          MACHINE = "noblesse-r08"
          DISTRO = "asteroid"
          PACKAGE_CLASSES = "package_ipk"
          BB_NUMBER_THREADS = "3"
          PARALLEL_MAKE = "-j3"
          EOF
          echo 'BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},8G,200M"' >> build/conf/local.conf
      - name: Verify R08 package metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p machine-logs
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e asteroid-machine-config > "$GITHUB_WORKSPACE/machine-logs/metadata-full.tmp"
          source_env="$GITHUB_WORKSPACE/machine-logs/metadata-full.tmp"
          grep -Fxq 'MACHINE="noblesse-r08"' "$source_env"
          grep -Fxq 'DISTRO="asteroid"' "$source_env"
          grep -Fxq 'OLDEST_KERNEL="4.9.59"' "$source_env"
          # This R08 package only writes a text machine.conf with Python.
          # Refuse another needless glibc/gcc cold build before running BitBake.
          python3 - "$source_env" <<'PY'
          from pathlib import Path
          import sys
          data = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              for key in ('INHIBIT_DEFAULT_DEPS', 'BASEDEPENDS', 'DEPENDS'):
                  if line.startswith(key + '='):
                      raw = line.partition('=')[2]
                      data[key] = raw[1:-1] if raw.startswith('"') and raw.endswith('"') else raw
          if data.get('INHIBIT_DEFAULT_DEPS') != '1':
              raise SystemExit('FAIL: R08 machine-config did not inhibit unnecessary compiler/libc dependencies')
          unexpected = {'virtual/cross-cc', 'virtual/compilerlibs', 'virtual/libc'}
          for key in ('BASEDEPENDS', 'DEPENDS'):
              bad = unexpected.intersection(data.get(key, '').split())
              if bad:
                  raise SystemExit(f'FAIL: {key} still pulls full target toolchain: {sorted(bad)}')
          print('PASS: effective BitBake R08 machine-config skips cross-gcc and glibc default dependencies')
          PY
          grep -E '^(MACHINE|DISTRO|OLDEST_KERNEL|MACHINE_DISPLAY_ROUND|MACHINE_HAS_WLAN|MACHINE_HAS_SPEAKER)=' "$source_env" > "$GITHUB_WORKSPACE/machine-logs/machine-metadata.txt"
          rm -f "$source_env"
      - name: Build actual upstream AsteroidOS machine-configuration package
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          echo 'Building target package with R08-only compiler/libc dependency inhibition'
          df -h "$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=5s 2700s \
            bitbake asteroid-machine-config 2>&1 | tee "$GITHUB_WORKSPACE/machine-logs/asteroid-machine-config-build.log"
      - name: Inspect generated Watch3 identity and capabilities
        shell: bash
        run: |
          set -euo pipefail
          config="$(find "$GITHUB_WORKSPACE/build/tmp/work" -path '*/asteroid-machine-config/1.0/image/etc/asteroid/machine.conf' -type f -print -quit)"
          test -n "$config" && test -s "$config" || { echo '::error::Missing installed AsteroidOS machine.conf'; exit 1; }
          cp "$config" "$GITHUB_WORKSPACE/machine-logs/asteroid-machine.conf"
          python3 "$GITHUB_WORKSPACE/tools/validate_asteroid_machine_config.py" "$config"
          # Also inspect real package staging rather than only do_install's image.
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e asteroid-machine-config > "$GITHUB_WORKSPACE/machine-logs/package-env.tmp"
          pkgdest="$(awk -F'"' '$1=="PKGDEST=" {print $2}' "$GITHUB_WORKSPACE/machine-logs/package-env.tmp" | tail -n 1)"
          rm -f "$GITHUB_WORKSPACE/machine-logs/package-env.tmp"
          packaged="$pkgdest/asteroid-machine-config/etc/asteroid/machine.conf"
          test -n "$pkgdest" && test -s "$packaged" || {
            echo "::error title=Target package missing::Expected asteroid-machine-config package file at $packaged"
            exit 1
          }
          cmp -s "$config" "$packaged" || {
            echo "::error::Packaged machine.conf differs from do_install output"
            exit 1
          }
          python3 "$GITHUB_WORKSPACE/tools/validate_asteroid_machine_config.py" "$packaged"
          echo 'PASS: validated actual R08 machine identity in packaged target payload'
          echo 'NOT TESTED: Qt compositor, full rootfs or Watch3 hardware'
      - name: Upload package metadata and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-asteroid-machine-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: machine-logs/
