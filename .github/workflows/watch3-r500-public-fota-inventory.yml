name: Issue 47 sibling Exynos 9110 FOTA archive inventory (offline only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/watch3-r500-public-fota-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-git-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Obtain only public Git object metadata (no firmware files)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 8 --max-time 35 --max-filesize 2000000 \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: UglyOS-research-issue-47' \
            'https://api.github.com/repos/lapinclown/SM-R500-TizenFOTA-pkgs/git/trees/main?recursive=1' \
            -o "$RUNNER_TEMP/r500-tree.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          from collections import Counter, defaultdict

          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'r500-tree.json'
          if p.stat().st_size > 2_000_000:
              raise SystemExit('TRUNCATED_OR_OVERSIZE_TREE_RESPONSE')
          obj = json.loads(p.read_text())
          if obj.get('truncated') is not False or not re.fullmatch(r'[0-9a-f]{40}', obj.get('sha', '')):
              raise SystemExit('TREE_METADATA_INCOMPLETE')
          rows = obj.get('tree')
          if not isinstance(rows, list) or not 1 <= len(rows) <= 1000:
              raise SystemExit('INVALID_GIT_TREE')
          files = []
          for row in rows:
              path, kind, sha = row.get('path'), row.get('type'), row.get('sha')
              if not isinstance(path,str) or not 1 <= len(path) <= 300 or not re.fullmatch(r'[0-9a-f]{40}',str(sha)):
                  raise SystemExit('INVALID_GIT_OBJECT')
              if kind == 'blob':
                  size = row.get('size')
                  if not isinstance(size,int) or size < 0:
                      raise SystemExit('INVALID_BLOB_SIZE')
                  files.append({'path': path, 'size': size})
          # Model-specific filenames are public upstream metadata only.
          candidates = sorted((x for x in files if re.search(
              r'sboot|bootloader|recovery|param|\.(?:zip|tar|md5|bin|enc4?|img|delta|ua)$',
              x['path'], re.I)), key=lambda x:x['path'])
          # Summarize total object-size footprints; don't assert authenticity or download assets.
          totals = defaultdict(int)
          for f in files:
              totals[f['path'].split('/')[0]] += f['size']
          print(json.dumps({
              'source_repository': 'lapinclown/SM-R500-TizenFOTA-pkgs',
              'source_model': 'SM-R500 (NOT SM-R840X)',
              'git_tree_sha': obj['sha'],
              'git_objects_in_tree': len(rows),
              'blob_count': len(files),
              'blob_manifest': sorted(files, key=lambda x: x['path'])[:50],
              'top_level_blob_bytes': dict(sorted(totals.items())),
              'candidate_paths': candidates[:80],
              'all_candidate_paths_reported': len(candidates) <= 80,
              'stock_r840x_images_found': False,
              'watch_contacted': False,
              'fota_archive_downloaded': False,
              'firmware_executed_or_written': False,
              'flash_allowed': False,
          },indent=2))
          PY
      - name: List oldest public sibling FOTA archive contents without extraction
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 10 --max-time 100 --max-filesize 37000000 \
            -H 'User-Agent: UglyOS-public-firmware-reference' \
            'https://raw.githubusercontent.com/lapinclown/SM-R500-TizenFOTA-pkgs/main/R500XXU1BSD3/R500XXU1BSD3-FOTA.7z' \
            -o "$RUNNER_TEMP/reference-R500-BSD3.7z"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          tree = json.loads((root / 'r500-tree.json').read_text())
          target = 'R500XXU1BSD3/R500XXU1BSD3-FOTA.7z'
          matches = [x for x in tree['tree'] if x.get('path') == target and x.get('type') == 'blob']
          if len(matches) != 1:
              raise SystemExit('EXPECTED_OLD_REFERENCE_ARCHIVE_NOT_IN_GIT_TREE')
          expected = matches[0]
          p = root / 'reference-R500-BSD3.7z'
          if p.stat().st_size != expected['size'] or not 1 <= p.stat().st_size <= 37_000_000:
              raise SystemExit('REFERENCE_ARCHIVE_SIZE_MISMATCH')
          blob = p.read_bytes()
          github_sha = hashlib.sha1(b'blob ' + str(len(blob)).encode() + b'\0' + blob).hexdigest()
          if github_sha != expected['sha']:
              raise SystemExit('REFERENCE_GIT_BLOB_HASH_MISMATCH')
          run = subprocess.run(['7z','l','-slt',str(p)],text=True,capture_output=True,timeout=50,check=True)
          out = run.stdout.split('----------',1)
          if len(out) != 2:
              raise SystemExit('ARCHIVE_MEMBER_LIST_NOT_FOUND')
          members = []
          for record in out[1].strip().split('\n\n'):
              info = {}
              for line in record.splitlines():
                  if ' = ' in line:
                      k,v=line.split(' = ',1)
                      info[k]=v
              name = info.get('Path')
              if not name:
                  continue
              if (len(name)>220 or name.startswith('/') or '..' in name.split('/')
                      or any(ord(ch)<32 for ch in name)):
                  raise SystemExit('UNSAFE_ARCHIVE_MEMBER_NAME')
              members.append({'name':name,'uncompressed_size':info.get('Size'),'folder':info.get('Folder')})
          if not 1 <= len(members) <= 2500:
              raise SystemExit('UNREASONABLE_ARCHIVE_MEMBER_COUNT')
          print(json.dumps({
              'reference_model': 'SM-R500 (NOT R840X)',
              'reference_build': 'R500XXU1BSD3',
              'archive_bytes': len(blob),
              'github_verified_blob_sha1': github_sha,
              'download_sha256': hashlib.sha256(blob).hexdigest(),
              'archive_member_count':len(members),
              'archive_members':members[:120],
              'archive_list_truncated':len(members)>120,
              'archive_extracted': False,
              'archive_code_executed': False,
              'watch_contacted':False,
              'stock_r840x_rescue_verified':False,
              'flash_allowed':False
          },indent=2))
          PY
      - name: Audit nested FOTA TAR headers only, in ephemeral runner filesystem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference-tar"
          7z e -bd -y "$RUNNER_TEMP/reference-R500-BSD3.7z" \
            "-o$RUNNER_TEMP/reference-tar" >/dev/null
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tarfile

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reference-tar'
          files = list(root.iterdir())
          if len(files) != 1 or files[0].name != 'R500XXU1BSD3-FOTA.tar' or not files[0].is_file():
              raise SystemExit('ARCHIVE_MEMBER_UNEXPECTED')
          p = files[0]
          if p.stat().st_size != 39589387:
              raise SystemExit('NESTED_TAR_LENGTH_CHANGED')
          with tarfile.open(p,'r:') as archive:
              members = archive.getmembers()
              if not 1 <= len(members) <= 2000:
                  raise SystemExit('NESTED_TAR_COUNT_UNBOUNDED')
              safe = []
              for m in members:
                  name = m.name
                  if (not 1 <= len(name) <= 240 or name.startswith('/')
                          or '..' in name.split('/') or any(ord(ch)<32 for ch in name)):
                      raise SystemExit('UNSAFE_NESTED_PATH')
                  safe.append({'name':name,'size':m.size,'type':m.type.decode('ascii','replace')})
          # Selectively inspect 5 known entries by exact name; no execution.
          import struct
          import subprocess
          selected = ['delta.ua','delta.boot','delta.recovery','delta.upparam','cm.bin',
                      'sboot.bin','update.cfg','unpack.sh']
          fingerprints = {}
          top_level = [m.name for m in members if '/' not in m.name]
          with tarfile.open(p,'r:') as archive:
              for name in selected:
                  matches = [m for m in archive.getmembers() if m.name == name and m.isfile()]
                  if len(matches) != 1 or matches[0].size > 16_000_000:
                      raise SystemExit('EXPECTED_SELECTED_REFERENCE_COMPONENT_MISSING')
                  content = archive.extractfile(matches[0]).read()
                  if len(content) != matches[0].size:
                      raise SystemExit('COMPONENT_READ_TRUNCATED')
                  item = {
                      'bytes':len(content),
                      'sha256':hashlib.sha256(content).hexdigest(),
                      'elf_magic':content[:4] == bytes((127,69,76,70)),
                  }
                  if name in ('sboot.bin','update.cfg','unpack.sh'):
                      item['header_16_bytes_hex'] = content[:16].hex()
                  if name == 'sboot.bin':
                      # Exact whitelist of comparison indicators, not arbitrary firmware strings.
                      words = ('SM-R500','SM-R840','ODIN','LOKE','EXYNOS','exynos',
                               'sboot','SBOOT','PIT','param','recovery','RECOVERY',
                               'BOOTLOADER','SECURE BOOT','ATF')
                      item['static_marker_occurrences'] = {
                          w:content.count(w.encode('ascii')) for w in words if w.encode('ascii') in content
                      }
                  if item['elf_magic'] and len(content) >= 20:
                      item['elf_class'] = content[4]
                      item['elf_endian'] = content[5]
                      item['elf_machine'] = struct.unpack_from('<H',content,18)[0]
                  if name == 'delta.ua' and item['elf_magic']:
                      temp_elf = root / 'reference-ua-readelf-only.bin'
                      temp_elf.write_bytes(content)
                      try:
                          result = subprocess.run(
                              ['readelf','-W','--dyn-syms',str(temp_elf)],
                              capture_output=True,text=True,timeout=20,check=True)
                          # Only allowlisted standard imports. Never print raw symbols or firmware strings.
                          allow = ('open','open64','openat','write','read','ioctl','fopen',
                                   'chmod','rename','unlink','memcpy','system','execve',
                                   'SHA256_Init','SHA256_Update','SHA256_Final','RSA_verify',
                                   'EVP_DigestVerifyFinal','g_dbus_proxy_call_sync')
                          item['selected_dynamic_imports'] = sorted(
                              name for name in allow if re.search(
                                  r'\b'+re.escape(name)+r'(?:@|\b)',result.stdout))
                      finally:
                          temp_elf.unlink(missing_ok=True)
                  fingerprints[name] = item
          print('COMPONENT_INSPECTION')
          print(json.dumps({
              'top_level_tar_names':top_level[:80],
              'top_level_name_count':len(top_level),
              'selected_components':fingerprints,
              'selected_firmware_executed':False,
              'reference_model':'SM-R500 only',
              'flash_allowed':False,
          },indent=2))
          print(json.dumps({
              'reference_model':'SM-R500 only',
              'reference_build':'R500XXU1BSD3',
              'nested_tar_bytes':p.stat().st_size,
              'nested_tar_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'nested_tar_member_count':len(safe),
              'nested_tar_members':safe[:120],
              'nested_member_list_truncated':len(safe)>120,
              'nested_payload_files_opened_or_executed':False,
              'firmware_published_to_repo':False,
              'physical_watch_contacted':False,
              'stock_r840x_recovery_verified':False,
              'flash_allowed':False,
          },indent=2))
          PY
      - name: Classify sibling boot deltas and update-agent implementation without execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import struct
          import subprocess
          import tarfile

          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reference-tar' / 'R500XXU1BSD3-FOTA.tar'
          if not p.is_file() or p.stat().st_size != 39589387:
              raise SystemExit('NESTED_REFERENCE_TAR_MISSING_OR_CHANGED')
          expected = {
              'cm.bin':2597136,
              'delta.boot':686281,
              'delta.ramdisk1':1622,
              'delta.ramdisk2':73789,
              'delta.recovery':2,
              'delta.ua':141748,
              'delta.upparam':11055,
          }
          with tarfile.open(p, 'r:') as tf:
              seen = {}
              for name, size in expected.items():
                  try: m = tf.getmember(name)
                  except KeyError: raise SystemExit('MISSING_EXPECTED_REFERENCE_MEMBER:' + name)
                  if not m.isfile() or m.size != size or m.size > 3000000:
                      raise SystemExit('UNEXPECTED_REFERENCE_MEMBER_SIZE_OR_TYPE:' + name)
                  fd = tf.extractfile(m)
                  if fd is None: raise SystemExit('MEMBER_UNREADABLE:' + name)
                  data = fd.read(size+1)
                  if len(data) != size: raise SystemExit('MEMBER_SHORT_READ:' + name)
                  seen[name] = data

          kinds = []
          for name, data in seen.items():
              if data.startswith(b'\x7fELF'):
                  fmt = 'ELF'
              elif data.startswith(b'\x1f\x8b'):
                  fmt = 'gzip'
              elif data.startswith(b'ANDROID!'):
                  fmt = 'Android-boot-header'
              else:
                  fmt = 'opaque-or-delta'
              kinds.append({'member':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                            'header_hex':data[:16].hex(),'header_kind':fmt})
          agent = seen['delta.ua']
          if not agent.startswith(b'\x7fELF'):
              print('REFERENCE_UPDATE_AGENT_NOT_ELF: do not assume executable architecture')
              elf = None
          else:
              elf = {'elf_class':agent[4], 'endian':agent[5],
                     'machine':struct.unpack('<H', agent[18:20])[0] if agent[5]==1 else None,
                     'type':struct.unpack('<H', agent[16:18])[0] if agent[5]==1 else None}
          # Record relevant identifier strings ONLY, without executing external firmware.
          pattern = re.compile(rb'[ -~]{7,220}')
          terms = re.compile(rb'(?i)fota|delta|recovery|boot|ramdisk|part_tbl|/dev/|/opt/|/usr/|signature|verif|crypto|sha|cert|md5|update|firmware|system|ext4|bspatch|librsync|libz|lzma')
          found = []
          for m in pattern.finditer(agent):
              b = m.group(0)
              if terms.search(b):
                  found.append(b.decode('ascii','replace'))
          # Do not emit excessively long runs or arbitrary embedded data.
          found = sorted(set(found))
          print(json.dumps({
              'model':'SM-R500 public reference, NOT R840X',
              'reference_tar_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'target_member_sizes_pinned_from_previous_real_run':True,
              'headers':kinds,
              'delta_ua_elf':elf,
              'delta_ua_relevant_strings':found[:80],
              'delta_ua_matches_truncated':len(found)>80,
              'original_r840x_firmware':False,
              'these_deltas_are_complete_recovery_images':False,
              'archive_contents_executed':False,
              'physical_watch_contacted':False,
              'flash_allowed':False
          },indent=2))
          PY
      - name: Record research limitation
        run: |
          echo 'Downloaded one public SM-R500 archive and unpacked only its containing TAR to ephemeral runner disk for header inspection. No watch communication, firmware execution or flashing.'
          echo 'Sibling SM-R500 filenames alone do NOT authenticate R840X stock rescue, signed images, PIT or custom boot.'
