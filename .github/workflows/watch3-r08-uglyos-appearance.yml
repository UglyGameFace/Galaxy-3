name: UgLy|OS R08 pinned AsteroidOS Settings accent patch (NO DEVICE)

# Source patch check only. No native Settings build or device access.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/watch3-r08-uglyos-appearance.yml'
      - 'meta-noblesse/recipes-asteroid/asteroid-settings/**'
      - 'meta-noblesse/recipes-asteroid/watch3-faces/watch3-faces/*.qml'
      - 'tools/validate_uglyos_settings_patch.py'
      - 'tests/test_uglyos_appearance_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pinned-settings-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-level appearance guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_uglyos_settings_patch.py
          python3 -m unittest discover -s tests -p test_uglyos_appearance_contract.py -v
      - name: Fetch exactly pinned AsteroidOS Settings revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinned-asteroid-settings"
          git -C "$RUNNER_TEMP/pinned-asteroid-settings" init -q
          git -C "$RUNNER_TEMP/pinned-asteroid-settings" remote add origin \
            https://github.com/AsteroidOS/asteroid-settings.git
          git -C "$RUNNER_TEMP/pinned-asteroid-settings" fetch --depth=1 \
            origin 60340bd1c27a7b9e4884bd61c0563d091bc8b240
          git -C "$RUNNER_TEMP/pinned-asteroid-settings" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-asteroid-settings" rev-parse HEAD)" = \
            60340bd1c27a7b9e4884bd61c0563d091bc8b240
      - name: Apply actual R08-only bbappend patch to pinned Settings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_uglyos_settings_patch.py \
            "$RUNNER_TEMP/pinned-asteroid-settings"
          {
            echo '## UgLy|OS accent Settings source-patch validation passed'
            echo '- Exact pinned AsteroidOS Settings revision tested'
            echo '- Stock selector retained, existing OptionCycler and Nemo.Configuration reused'
            echo '- Six choices include Original for unmodified default face palettes'
            echo '- NOT TESTED: Settings binary, persistence, image, Watch3 boot or flashing'
          } >> "$GITHUB_STEP_SUMMARY"
