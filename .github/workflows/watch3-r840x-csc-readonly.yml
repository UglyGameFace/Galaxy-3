name: Watch3 R840X active CSC read-only fixed-file probe (NO WATCH IN CI)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/watch3_r840x_csc_readonly.py'
      - 'tests/test_watch3_r840x_csc_readonly.py'
      - 'docs/watch3-r840x-csc-readonly.md'
      - '.github/workflows/watch3-r840x-csc-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-sdb-csc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test exact single read-only SDB RECV and privacy with fake watch only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_watch3_r840x_csc_readonly.py' -v
          python3 -m unittest discover -s tests -p 'test_watch3_r08_fota_manifest_probe.py' -v
          python3 -m py_compile tools/watch3_r840x_csc_readonly.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/watch3_r840x_csc_readonly.py').read_text()
          assert 'CSC_PATH = b"/opt/system/csc-default/output/csc-active-customer.log"' in source
          assert 'MAX_CSC_BYTES = 128' in source
          assert 'SYNC_HDR.pack(b"RECV"' in source
          assert 'b"SEND"' not in source
          assert 'b"shell:' not in source
          assert 'b"ODIN"' not in source
          assert '"flash_allowed": False' in source
          print('PASS: strict fixed path, bounded redacted CSC report, no flash approval')
          PY
          git diff --check
          echo 'NO WATCH CONTACT: only synthetic SDB peer fixtures.'
