name: Issue 47 S-BOOT PIT semantic diff (no device)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/watch3_sboot_pit_semantic_diff.py'
      - 'tools/watch3_sboot_pit_control_flow.py'
      - 'tools/watch3_sboot_stage_map.py'
      - 'tools/watch3_sboot_xref_map.py'
      - 'tests/test_watch3_sboot_pit_semantic_diff.py'
      - 'tests/test_watch3_sboot_pit_control_flow.py'
      - 'tests/test_watch3_sboot_stage_map.py'
      - 'tests/test_watch3_sboot_xref_map.py'
      - '.github/workflows/watch3-sboot-pit-semantic-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-reference-pit-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic decoder, safety and mutation regressions
        run: python3 -m unittest discover -s tests -p 'test_watch3_sboot_pit_*.py' -v
      - name: Reject malformed or misleading candidate S-BOOT stage metadata
        run: python3 -m unittest discover -s tests -p 'test_watch3_sboot_stage_map.py' -v
      - name: Fetch pinned historical R500 FOTA archives (NOT R840X)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p "$RUNNER_TEMP/older" "$RUNNER_TEMP/newer"
          curl -fL --retry 2 --connect-timeout 10 --max-time 140 --max-filesize 40000000 \
            'https://raw.githubusercontent.com/lapinclown/SM-R500-TizenFOTA-pkgs/main/R500XXU1BSD3/R500XXU1BSD3-FOTA.7z' \
            -o "$RUNNER_TEMP/older/reference.7z"
          curl -fL --retry 2 --connect-timeout 10 --max-time 140 --max-filesize 60000000 \
            'https://raw.githubusercontent.com/lapinclown/SM-R500-TizenFOTA-pkgs/main/R500XXU1GUJ2/R500XXU1GUJ2-FOTA.7z' \
            -o "$RUNNER_TEMP/newer/reference.7z"
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          pairs=(('older','6d104d87d934af6908fd182a589662b72d06e4ad79445896b15355fd77f97586',None),
                 ('newer',None,'3f7fb436056ad43a58a735ae026b5ac603ea1ae8'))
          for side,sha256,gitsha in pairs:
              p=root/side/'reference.7z'
              size=p.stat().st_size
              if not 1_000_000<=size<=60_000_000:raise SystemExit('ARCHIVE_LENGTH_UNEXPECTED:'+side)
              blob=p.read_bytes()
              if sha256 and hashlib.sha256(blob).hexdigest()!=sha256:
                  raise SystemExit('ARCHIVE_SHA256_MISMATCH:'+side)
              if gitsha and hashlib.sha1(b'blob '+str(size).encode()+b'\0'+blob).hexdigest()!=gitsha:
                  raise SystemExit('GIT_BLOB_SHA1_MISMATCH:'+side)
          PY
      - name: Extract only reference TAR for offline reading; check S-BOOT hashes
        shell: bash
        run: |
          set -euo pipefail
          7z e -bd -y "$RUNNER_TEMP/older/reference.7z" "-o$RUNNER_TEMP/older" >/dev/null
          7z e -bd -y "$RUNNER_TEMP/newer/reference.7z" "-o$RUNNER_TEMP/newer" >/dev/null
          python3 - <<'PY'
          import hashlib,os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for side,build,sha in (
             ('older','R500XXU1BSD3','4715861156eeceb949899d355ccc37eefb57062888aadc76aa9f93f9eaf5966e'),
             ('newer','R500XXU1GUJ2','c96813f283e2f98d3f33a30c6215fa25b06b756b93adf55ecf8d59fc4d9211a9')):
              folder=root/side
              matches=list(folder.glob('*.tar'))
              if len(matches)!=1 or matches[0].name!=build+'-FOTA.tar' or matches[0].stat().st_size>150_000_000:
                  raise SystemExit('UNEXPECTED_TAR:'+side)
              with tarfile.open(matches[0],'r:') as tf:
                  found=[m for m in tf.getmembers() if m.name=='sboot.bin']
                  if len(found)!=1 or not found[0].isfile() or found[0].size!=1_921_296:
                      raise SystemExit('UNEXPECTED_SBOOT_MEMBER:'+side)
                  fd=tf.extractfile(found[0]); assert fd is not None
                  blob=fd.read(1_921_297)
              if len(blob)!=1_921_296 or hashlib.sha256(blob).hexdigest()!=sha:
                  raise SystemExit('SBOOT_SHA256_MISMATCH:'+side)
              (folder/'reference-sboot.bin').write_bytes(blob)
          PY
      - name: Run semantic comparison against actual pinned original instruction bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/watch3_sboot_pit_semantic_diff.py \
            --older "$RUNNER_TEMP/older/reference-sboot.bin" \
            --newer "$RUNNER_TEMP/newer/reference-sboot.bin" \
            --output "$RUNNER_TEMP/semantic-diff.json"
          python3 - <<'PY'
          import json,os,pathlib
          result=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'semantic-diff.json').read_text())
          assert result['decision']=='NO_GO' and result['watch_contacted'] is False
          print(json.dumps({
             'model': result['source_model'],
             '2019_PIT_xref':result['older']['pit_string_reference'],
             '2021_PIT_xref':result['newer']['pit_string_reference'],
             '2019_length_check':result['older']['compare_0x2000'],
             '2021_length_check':result['newer']['compare_0x2000'],
             '2019_magic':result['older']['construct_0x12349876'],
             '2021_magic':result['newer']['construct_0x12349876'],
             'same_instruction_class_window':result['same_opcode_class_sequence_in_bounded_window'],
             'cve_patch_identified':False,'watch_contacted':False,'flash_allowed':False,
          },indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## SM-R500 sibling PIT-check study (off-device only)\n')
              for name in ('both_have_raw_offset_pit_xref','both_compare_0x2000',
                           'both_construct_0x12349876','same_opcode_class_sequence_in_bounded_window'):
                  out.write(f'- {name}: **{result[name]}**\n')
              out.write('- Not an R840X vulnerability demonstration, recovery image or boot method. **NO_GO**.\n')
          PY
      - name: Reconstruct and assert actual bounded PIT branch gates in both original binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/watch3_sboot_pit_control_flow.py \
            --older "$RUNNER_TEMP/older/reference-sboot.bin" \
            --newer "$RUNNER_TEMP/newer/reference-sboot.bin" \
            --output "$RUNNER_TEMP/branch-graph.json"
          python3 - <<'PY'
          import json, os, pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'branch-graph.json').read_text())
          assert report['decision']=='NO_GO' and not report['watch_contacted']
          assert report['both_reference_versions_match_canonical_three_guard_shape'], (
              'REFERENCE_SBOOT_GUARD_SEQUENCE_CHANGED')
          summary={}
          for build, gates in report['gates'].items():
              pre=gates['status_error_bit_guards']
              length=gates['length_greater_than_0x2000_guards']
              header=gates['header_equal_to_magic_guards']
              trace=gates['header_not_equal_fallthrough_trace']
              assert len(pre)==len(length)==len(header)==1
              assert trace['stop']=='RET' and trace['movn_w0_minus_one_offsets'], (
                  'REFERENCE_MAGIC_MISMATCH_RETURN_PATH_CHANGED:'+build)
              assert header[0]['lhs_register']==2 and header[0]['magic_register']==3
              summary[build]={
                  'candidate_status_bit_guard':pre[0],
                  'candidate_length_guard':length[0],
                  'candidate_header_magic_guard':header[0],
                  'header_mismatch_fallthrough':trace,
                  'bounded_graph_nodes':report['graphs'][build]['decoded_reachable_raw_offset_count'],
                  'bounded_graph_edges':len(report['graphs'][build]['bounded_branch_edges']),
                  'verified_live_runtime_path':False,
              }
          print('PINNED_SBOOT_PIT_BRANCH_GRAPH')
          print(json.dumps(summary,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Original SM-R500 S-BOOT bounded branch structure\n')
              for build,x in summary.items():
                  f.write(f"- {build}: three candidate guards, raw header-equal branch target "
                          f"{hex(x['candidate_header_magic_guard']['branch_target'])}; "
                          f"header-mismatch path to observed RET at "
                          f"{hex(x['header_mismatch_fallthrough']['end_file_offset'])}.\n")
              f.write('- Raw file-offset graph only. No runtime mapping, sender reachability, '
                      'CVE root cause, SM-R840X custom boot or full stock rescue proven. **NO_GO**.\n')
          PY
      - name: Verify real donor PIT dispatcher arguments and distinguish the adjacent routine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          result=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"branch-graph.json").read_text())
          assert result["decision"]=="NO_GO" and not result["watch_contacted"]
          for build, section in result["inbound_candidate_edges"].items():
              edges=section["incoming_direct_edges"]
              assert section["candidate_stage_only"] is True
              assert section["function_entry_verified"] is False
              assert section["call_chain_to_wireless_protocol_verified"] is False
              assert section["candidate_direct_call_count"]+section["candidate_direct_branch_count"]==len(edges)
              assert all(x["verified_external_wireless_caller"] is False for x in edges)
              assert section["candidate_direct_call_count"]==2
              assert section["candidate_direct_calls_to_pit_frame_entry"]==1, (
                  "PIT_VALIDATOR_AND_ADJACENT_ROUTINE_CONFLATED:"+build)
              context=result["donor_dispatch_context"][build]
              assert context["observed_slice_matches"], context["checks"]
              assert context["path_classification"]=="PIT_UPLOAD_FINALIZATION_CANDIDATE"
              assert (context["command_value"],context["subcommand_value"],
                      context["required_state_value"])==(0x65,3,0)
              assert context["validator_buffer_object_offset"]==0x30
              assert context["validator_length_object_offset"]==0x58
              assert context["wireless_transport_proven"] is False
              assert context["owner_R840X_equivalence_proven"] is False
              assert context["safe_read_only_device_operation_proven"] is False
              print(build, json.dumps({"incoming_edges":edges,"dispatch_context":context},indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n## Original SM-R500 PIT dispatch operand provenance\n")
              for name, r in result["inbound_candidate_edges"].items():
                  f.write(f"- {name}: two nearby call targets, "
                          f"{r['candidate_direct_calls_to_pit_frame_entry']} to the PIT entry candidate. "
                          "Command 0x65 / subcommand 3 / state 0; buffer +0x30, length +0x58.\n")
              f.write("- Upload-finalization candidate, not a proven read-only probe. "
                      "No exact R840X bytes, wireless reachability, unlock or stock rescue. **NO_GO**.\n")
          PY
      - name: Map bounded S-BOOT stage header candidates from two original reference firmware files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/watch3_sboot_stage_map.py \
            --older "$RUNNER_TEMP/older/reference-sboot.bin" \
            --newer "$RUNNER_TEMP/newer/reference-sboot.bin" \
            --output "$RUNNER_TEMP/stage-metadata.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"stage-metadata.json"
          r=json.loads(p.read_text())
          assert r["status"]=="NO_GO" and not r["real_r840x_sboot_obtained"]
          brief={}
          for build,data in r["images"].items():
              parts=data["observed_header_boundaries"]
              assert len(parts)==2 and parts[0]["end_exclusive"]==parts[1]["start"]
              assert 2048 <= parts[0]["end_exclusive"] < parts[1]["end_exclusive"] < 1_921_296
              footer_candidates=sum(len(x["candidates"])
                                    for x in data["stage2_signature_footer_pattern_hypotheses"])
              boundaries=sorted({row["boundary_candidate"]
                                 for group in data["stage2_signature_footer_pattern_hypotheses"]
                                 for row in group["candidates"]})
              assert boundaries==[0x40000, 0x115000, 0x155000, 0x1D5000], (
                  "PINNED_ORIGINAL_SBOOT_STAGE_CANDIDATES_CHANGED:"+build)
              pit=r["candidate_pit_code_regions"][build]
              assert pit is not None and pit["candidate_region_index"]==1
              assert (pit["start_file_offset"],pit["end_file_offset_exclusive"])==(
                  0x40000,0x115000)
              assert pit["code_reachable_from_wireless_odin_proven"] is False
              brief[build]={
                  "BL1_candidate_end":parts[0]["end_exclusive"],
                  "EPBL_candidate_end":parts[1]["end_exclusive"],
                  "footer_candidate_count_unverified":footer_candidates,
                  "PIT_validator_candidate_interval":pit,
                  "candidate_boundary_offsets":boundaries,
                  "footer_pattern_groups":[
                      {"assumed_signature_length":x["signature_bytes_hypothesis"],
                       "epbl_header_fields":x["epbl_marker_numeric_fields"],
                       "candidate_offsets":[
                           [v["footer_file_offset"],v["boundary_candidate"]]
                           for v in x["candidates"][:24]],
                       "truncated":len(x["candidates"])>24}
                      for x in data["stage2_signature_footer_pattern_hypotheses"]],

                  "ODIN_marker_count":len(data["reference_marker_locations"]["ODIN"]),
                  "LOKE_marker_count":len(data["reference_marker_locations"]["LOKE"]),
                  "PIT_marker_count":len(data["reference_marker_locations"]["PIT"]),
                  "signature_verified":data["signature_cryptographically_verified"],
                  "main_bootloader_stage_boundaries_verified":data["main_bootloader_stage_boundaries_proven"],
              }
          assert r["pit_code_region_correspondence_hypothesis"] is True
          print("PINNED_SBOOT_STAGE_HEADER_METADATA")
          print(json.dumps(brief,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n## Original SM-R500 S-BOOT stage-header candidates\n")
              for name,row in brief.items():
                  f.write(f"- {name}: BL1 header end 0x{row['BL1_candidate_end']:x}, "
                          f"EPBL header end 0x{row['EPBL_candidate_end']:x}, "
                          f"footer-pattern candidates {row['footer_candidate_count_unverified']}.\n")
              f.write("- **No signature verification, exact SM-R840X bootloader, recovery or "
                      "custom kernel acceptance. Physical writes remain NO_GO.**\n")
          PY
      - name: Assert genuine sibling ARM64 PC-relative reference locations (not a watch exploit)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_watch3_sboot_xref_map.py' -v
          python3 tools/watch3_sboot_xref_map.py \
            --older "$RUNNER_TEMP/older/reference-sboot.bin" \
            --newer "$RUNNER_TEMP/newer/reference-sboot.bin" \
            --output "$RUNNER_TEMP/xrefs.json"
          python3 - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'xrefs.json').read_text())
          assert d['decision']=='NO_GO' and not d['source_is_exact_owner_bootloader']
          assert all(d['known_pit_xref_anchor_present'].values()), 'REAL_SBOOT_KNOWN_PIT_XREF_MISSING'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Verified sibling ARM64 literal-reference candidates\n')
              for build, report in d['models'].items():
                  f.write(f"- {build}: " +
                          ', '.join(f"{name}={num}" for name,num in report['xref_counts'].items()) +
                          '. File-offset candidates only, never handler reachability.\n')
              f.write('- SM-R840X original S-BOOT missing; no CVE proof, unlock or recovery. **NO_GO**.\n')
          PY
      - name: Verify repository left unchanged and firmware not committed
        run: git diff --exit-code && git status --short
