name: Watch3 R08 free staged ARM64 AsteroidOS build

# Continue one real ARM64 package/image at a time using signed Yocto sstate.
# No new run on workflow edits; explicit dispatch avoids duplicate warm-ups.
# OFF-DEVICE ONLY: even an ext4 build is not a flashable or boot-validated image.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ARM64 Qt, launcher, or offline AsteroidOS image'
        required: true
        type: choice
        default: qtbase
        options:
          - qtbase
          - qtdeclarative
          - qtwayland
          - asteroid-launcher
          - asteroid-image

permissions:
  contents: read

concurrency:
  group: galaxy3-r08-qt-linuxfb-package
  cancel-in-progress: false

jobs:
  asteroid-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout Galaxy-3
        uses: actions/checkout@v4
      - name: Check free runner capacity before fetching pinned sources
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          free -h
          disk_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
          if (( disk_kib < 30 * 1024 * 1024 || mem_kib < 4 * 1024 * 1024 )); then
            echo "::error title=Runner capacity below package gate::Need >=30 GiB free disk and >=4 GiB RAM for small metadata package task. No build started."
            exit 1
          fi
          echo 'PASS: available free runner supports bounded machine configuration package stage'
      - name: Install metadata parsing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-packaging python3-setuptools gawk diffstat chrpath
      - name: Fetch the upstream AsteroidOS metadata layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src preflight-logs
          get_layer() {
            local dest="$1" url="$2" branch="$3"
            git clone --depth=1 --single-branch --branch "$branch" "$url" "src/$dest"
            printf '%s %s %s\n' "$dest" "$branch" "$(git -C "src/$dest" rev-parse HEAD)" | tee -a preflight-logs/upstream-commits.txt
          }
          get_layer oe-core https://github.com/openembedded/openembedded-core.git whinlatter
          get_layer oe-core/bitbake https://github.com/openembedded/bitbake.git 2.16
          # Reuse the same known-good core revisions as the successful R08 Linux rootfs.
          git -C src/oe-core fetch --depth=1 origin 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core checkout --detach 8751ec83421192fc0f8495fb95798f9eb7be77a0
          git -C src/oe-core/bitbake fetch --depth=1 origin 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          git -C src/oe-core/bitbake checkout --detach 713fbbdb9ecc195ceb2216a2345e0d79dbee2135
          get_layer meta-openembedded https://github.com/openembedded/meta-openembedded.git whinlatter
          get_layer meta-qt6 https://code.qt.io/yocto/meta-qt6.git 6.11
          get_layer meta-smartphone https://github.com/shr-distribution/meta-smartphone.git whinlatter
          get_layer meta-clang https://github.com/kraj/meta-clang.git whinlatter
          get_layer meta-asteroid https://github.com/AsteroidOS/meta-asteroid.git master
          get_layer meta-asteroid-community https://github.com/AsteroidOS/meta-asteroid-community.git master
          get_layer meta-virtualization https://git.yoctoproject.org/meta-virtualization whinlatter
          git -C src/meta-openembedded checkout --detach f52f32952cb9717949f8bc3d3ccf6c4c5a59521f
          git -C src/meta-qt6 checkout --detach ec98b3ab1c8deeab9412ef6cbfd55729dc567b01
          git -C src/meta-smartphone checkout --detach 0ef4e8979fbf3403ff8aef977874496dc312d913
          git -C src/meta-clang checkout --detach cf20f8bd1366d41094c945597b95dd746e87b871
          # master can advance after the shallow clone; explicitly fetch our tested commit.
          git -C src/meta-asteroid fetch --depth=1 origin 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid checkout --detach 1af66a6188f7909303cfcec779c8475be1bc4679
          git -C src/meta-asteroid-community checkout --detach f911d8900b2da887d1486416a8c16b8f8f15dd35
          git -C src/meta-virtualization checkout --detach 8f03a0cc8950ef5d5e4f11d9ae494946d1991e45
          { echo 'PINNED CORE:'; git -C src/oe-core rev-parse HEAD; git -C src/oe-core/bitbake rev-parse HEAD; } | tee -a preflight-logs/upstream-commits.txt
          echo 'AsteroidOS source layers downloaded; no kernel or operating system built.'
      - name: Configure actual AsteroidOS distro with R08 machine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/conf preflight-logs
          cat > build/conf/bblayers.conf <<'EOF'
          BBPATH = "${TOPDIR}"
          BBLAYERS = " \
            ${TOPDIR}/../src/oe-core/meta \
            ${TOPDIR}/../src/meta-qt6 \
            ${TOPDIR}/../src/meta-asteroid \
            ${TOPDIR}/../src/meta-asteroid-community \
            ${TOPDIR}/../src/meta-openembedded/meta-oe \
            ${TOPDIR}/../src/meta-openembedded/meta-multimedia \
            ${TOPDIR}/../src/meta-openembedded/meta-gnome \
            ${TOPDIR}/../src/meta-openembedded/meta-networking \
            ${TOPDIR}/../src/meta-smartphone/meta-android \
            ${TOPDIR}/../src/meta-openembedded/meta-python \
            ${TOPDIR}/../src/meta-openembedded/meta-filesystems \
            ${TOPDIR}/../src/meta-clang \
            ${TOPDIR}/../src/meta-virtualization \
            ${TOPDIR}/../meta-noblesse \
          "
          EOF
          cat > build/conf/local.conf <<'EOF'
          MACHINE = "noblesse-r08"
          DISTRO = "asteroid"
          PACKAGE_CLASSES = "package_ipk"
          BB_NUMBER_THREADS = "3"
          PARALLEL_MAKE = "-j3"
          EOF
          mkdir -p "$HOME/.cache/watch3-yocto/sstate-cache" "$HOME/.cache/watch3-yocto/downloads"
          printf 'SSTATE_DIR = "%s/.cache/watch3-yocto/sstate-cache"\n' "$HOME" >> build/conf/local.conf
          printf 'DL_DIR = "%s/.cache/watch3-yocto/downloads"\n' "$HOME" >> build/conf/local.conf
          echo 'BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},8G,100K"' >> build/conf/local.conf
      - name: Check that inode safety limit fits this free runner
        shell: bash
        run: |
          set -euo pipefail
          # The previous 200M free-inode threshold meant 209,715,200
          # inodes and stopped the build with ~18 million actually free.
          df -h "$GITHUB_WORKSPACE"
          df -i "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import os
          config = Path('build/conf/local.conf').read_text()
          limits = [line for line in config.splitlines() if line.startswith('BB_DISKMON_DIRS = ')]
          assert len(limits) == 1 and limits[0].endswith(',8G,100K"'), 'Unsafe BitBake disk/inode limit'
          st = os.statvfs('build')
          disk_gib = st.f_bavail * st.f_frsize / 1024**3
          print(f'Free disk: {disk_gib:.1f} GiB; stop limit: 8 GiB')
          assert disk_gib >= 20, 'Free disk too low for this build'
          if st.f_files > 0 and st.f_favail >= 0:
              print(f'Free inodes: {st.f_favail:,}; stop limit: 102,400')
              assert st.f_favail >= 500_000, 'Free inodes too low for this build'
          print('PASS: BitBake inode guard is realistic and filesystem has headroom')
          PY
      - name: Restore previous completed R08 task archive snapshot
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/watch3-yocto/sstate-snapshot
          key: galaxy3-r08-oe8751-qt611-v1-sstate-${{ inputs.target }}-${{ github.run_id }}
          restore-keys: |
            galaxy3-r08-oe8751-qt611-v1-sstate-

      - name: Restore paired sstate archives to the active BitBake cache
        shell: bash
        run: |
          set -euo pipefail
          saved="$HOME/.cache/watch3-yocto/sstate-snapshot"
          if [ -f "$saved/watch3-sstate-manifest.json" ]; then
            python3 tools/watch3_yocto_sstate_checkpoint.py restore \
              "$saved" "$HOME/.cache/watch3-yocto/sstate-cache"
          else
            echo 'CACHE MISS: first R08 compile stage has no saved task state'
          fi
          # Signed cache pairs were regression-tested in earlier runs; restore
          # still validates their manifest and content before BitBake consumes them.

      - name: Check actual R08 target and pinned machine before building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage-logs
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e "$TARGET" > "$GITHUB_WORKSPACE/stage-logs/target.env"
          python3 - "$GITHUB_WORKSPACE/stage-logs/target.env" "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          values = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              for name in ('PN', 'MACHINE', 'DISTRO', 'PV', 'IMAGE_FSTYPES'):
                  if line.startswith(name + '='):
                      raw = line.partition('=')[2]
                      values[name] = raw[1:-1] if raw.startswith('"') and raw.endswith('"') else raw
          target = sys.argv[2]
          for key, want in (('PN', target), ('MACHINE', 'noblesse-r08'), ('DISTRO', 'asteroid')):
              assert values.get(key) == want, f'{key}: expected {want}, got {values.get(key)}'
          if target.startswith('qt'):
              assert values.get('PV') == '6.11.3', f'Unexpected Qt PV: {values.get("PV")}'
          if target == 'asteroid-image':
              assert 'ext4' in values.get('IMAGE_FSTYPES', '').split(), 'Missing ext4 image output'
          print(f'PASS: pinned R08 {target} recipe (offline only)')
          PY
          rm -f "$GITHUB_WORKSPACE/stage-logs/target.env"
          # The real BitBake build evaluates dependencies itself. Do not repeat
          # expensive bitbake -g graph probes already proven in earlier runs.

      - name: Run bounded real ARM64 package or offline image stage
        id: qtbuild
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          # Leave time inside the six-hour hosted-runner limit for signed
          # checkpoint saving, ARM64 validation and diagnostic artifacts.
          seconds=18000
          if [ "$TARGET" = asteroid-image ]; then
            build_command=(bitbake asteroid-image)
          else
            build_command=(bitbake -c package "$TARGET")
          fi
          echo "Building $TARGET with ${build_command[*]} (max five hours)"
          set +e
          timeout --signal=TERM --kill-after=15s "$seconds" \
            "${build_command[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/stage-logs/build.log"
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo 'finished=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=PARTIAL R08 build::$TARGET reached its compile window; signed task outputs will be checkpointed"
            {
              echo "## PARTIAL: $TARGET (not yet a completed binary or image)"
              echo "- Completed sstate task archives will be saved; retry the same target."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 0 ]; then
            echo 'finished=true' >> "$GITHUB_OUTPUT"
            echo "## Build finished: $TARGET (ARM64 artifact validation follows)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'finished=false' >> "$GITHUB_OUTPUT"
            echo "::error::BitBake $TARGET failed with status $status"
            exit "$status"
          fi

      - name: Checkpoint up to 4 GiB of completed signature-matched tasks
        id: checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source="$HOME/.cache/watch3-yocto/sstate-cache"
          dest="$HOME/.cache/watch3-yocto/sstate-snapshot"
          if [ ! -d "$source" ] || [ -z "$(find "$source" -type f -name '*.tar.zst' -print -quit)" ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No completed sstate archives to checkpoint'
            exit 0
          fi
          free_kib="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          if (( free_kib < 10 * 1024 * 1024 )); then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping cache duplication with insufficient free disk'
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/tools/watch3_yocto_sstate_checkpoint.py" \
            checkpoint "$source" "$dest" --max-mib 4096
          python3 - "$dest/watch3-sstate-manifest.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          state = json.loads(Path(sys.argv[1]).read_text())
          with Path(sys.argv[2]).open('a') as f:
              f.write("present=" + ("true" if state['archive_pairs'] else "false") + "\n")
          summary = (f"- Real completed sstate pairs saved: **{state['archive_pairs']}**\\n"
                     f"- Portable snapshot: **{state['bytes']/1024**2:.1f} MiB** (4 GiB cap)\\n"
                     f"- Omitted for size: **{state['skipped_pairs']}** pairs\\n"
                     "- A saved checkpoint is **not** a completed Qt binary.\\n")
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write(summary)
          print(f"CHECKPOINT: {state['archive_pairs']} complete task archives, "
                f"{state['bytes']/1024**3:.2f} GiB (max 4 GiB)")
          PY

      - name: Save reusable task outputs to default free GitHub cache
        if: always() && steps.checkpoint.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/watch3-yocto/sstate-snapshot
          key: galaxy3-r08-oe8751-qt611-v1-sstate-${{ inputs.target }}-${{ github.run_id }}

      - name: Validate built ARM64 package or offline rootfs
        if: steps.qtbuild.outputs.finished == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source src/oe-core/oe-init-build-env build >/dev/null
          set -u
          bitbake -e "$TARGET" > "$GITHUB_WORKSPACE/stage-logs/postbuild.env"
          if [ "$TARGET" = asteroid-image ]; then
            python3 - "$GITHUB_WORKSPACE/stage-logs/postbuild.env" "$GITHUB_WORKSPACE/stage-logs/image-paths.txt" <<'PY'
          from pathlib import Path
          import sys
          variables = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              for key in ('MACHINE', 'DISTRO', 'IMAGE_ROOTFS', 'IMAGE_MANIFEST', 'DEPLOY_DIR_IMAGE'):
                  if line.startswith(key + '='):
                      raw = line.partition('=')[2]
                      variables[key] = raw[1:-1] if raw.startswith('"') and raw.endswith('"') else raw
          assert variables.get('MACHINE') == 'noblesse-r08'
          assert variables.get('DISTRO') == 'asteroid'
          rootfs = Path(variables['IMAGE_ROOTFS'])
          manifest = Path(variables['IMAGE_MANIFEST'])
          deploy = Path(variables['DEPLOY_DIR_IMAGE'])
          assert rootfs.is_dir() and manifest.is_file(), 'Actual image rootfs/manifest not found'
          images = [p for p in deploy.glob('asteroid-image*.ext4') if p.is_file() and p.stat().st_size > 0]
          assert images, 'No generated non-empty AsteroidOS ext4 image'
          with Path(sys.argv[2]).open('w') as out:
              out.write(str(rootfs) + '\n' + str(manifest) + '\n' + str(images[0].resolve()) + '\n')
          print('PASS: actual R08 image rootfs, manifest and ext4 found')
          PY
            mapfile -t paths < "$GITHUB_WORKSPACE/stage-logs/image-paths.txt"
            python3 "$GITHUB_WORKSPACE/tools/validate_watch3_graphics_rootfs.py" \
              "${paths[0]}" --installed-packages "${paths[1]}"
            sha256sum "${paths[2]}" > "$GITHUB_WORKSPACE/stage-logs/asteroid-image.sha256"
            echo "VALIDATED_IMAGE_PATH=${paths[2]}" >> "$GITHUB_ENV"
            cp "${paths[1]}" "$GITHUB_WORKSPACE/stage-logs/installed-packages.manifest"
            echo 'PASS: offline ARM64 AsteroidOS rootfs and ext4 image; NOT boot-tested or flashable'
          else
            pkg="$(awk -F'"' '$1=="PKGDEST=" {print $2}' "$GITHUB_WORKSPACE/stage-logs/postbuild.env" | tail -n 1)"
            test -n "$pkg" && test -d "$pkg"
            if [ "$TARGET" = qtbase ]; then
              python3 "$GITHUB_WORKSPACE/tools/validate_watch3_qt_linuxfb_package.py" "$pkg"
              found="$(find "$pkg/qtbase-plugins" -name libqlinuxfb.so -type f -print -quit)"
              mkdir -p "$GITHUB_WORKSPACE/stage-logs/arm64"
              cp -L "$found" "$GITHUB_WORKSPACE/stage-logs/arm64/libqlinuxfb.so"
            elif [ "$TARGET" = qtwayland ]; then
              python3 "$GITHUB_WORKSPACE/tools/validate_watch3_qtwayland_package.py" "$pkg"
              mkdir -p "$GITHUB_WORKSPACE/stage-logs/arm64"
              find "$pkg/qtwayland" -name 'libQt6WaylandCompositor.so.*' -type f -exec cp -L '{}' "$GITHUB_WORKSPACE/stage-logs/arm64/" ';'
              find "$pkg/qtwayland-plugins" -name 'libqwayland*.so' -type f -exec cp -L '{}' "$GITHUB_WORKSPACE/stage-logs/arm64/" ';'
            elif [ "$TARGET" = qtdeclarative ]; then
              test -d "$pkg/qtdeclarative" && test -d "$pkg/qtdeclarative-qmlplugins"
            elif [ "$TARGET" = asteroid-launcher ]; then
              PYTHONPATH="$GITHUB_WORKSPACE" python3 - "$pkg/asteroid-launcher/usr/bin/asteroid-launcher" <<'PY'
          from pathlib import Path
          import sys
          from tools.validate_watch3_graphics_rootfs import elf_aarch64
          binary = Path(sys.argv[1])
          good, reason = elf_aarch64(binary)
          assert good, f'No valid ARM64 asteroid-launcher: {reason}'
          print('PASS: real packaged ELF64 AArch64 asteroid-launcher')
          PY
            fi
            echo "PASS: validated $TARGET target package on the R08 machine"
          fi
          rm -f "$GITHUB_WORKSPACE/stage-logs/postbuild.env"

      - name: Preserve validated OFF-DEVICE ext4 AsteroidOS output
        if: steps.qtbuild.outputs.finished == 'true' && env.TARGET == 'asteroid-image'
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-OFFLINE-NOT-FLASHABLE-image-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.VALIDATED_IMAGE_PATH }}

      - name: Preserve validated ELF files and stage logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy3-r08-build-stage-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            stage-logs/build.log
            stage-logs/image-paths.txt
            stage-logs/asteroid-image.sha256
            stage-logs/installed-packages.manifest
            stage-logs/arm64/
