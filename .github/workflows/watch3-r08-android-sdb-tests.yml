name: Watch3 R08 Android SDB read-only socket tests (NO WATCH)

# Synthetic in-memory SDB peer ONLY; no physical device connections,
# network scanning, device boot, flashing, root or package installation.
# A separate disposable private host D-Bus verifies registry behavior.
# A real host systemd fixture verifies show does not start its inactive unit.
# Native root-control frames and conditional backups use fake peers only.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/watch3_r08_android_sdb.py'
      - 'tools/watch3_r840x_fota_owner_readonly.py'
      - 'tools/watch3_r840x_native_root.py'
      - 'tests/test_watch3_r840x_native_root.py'
      - 'tools/watch3_r840x_security_metadata.py'
      - 'tools/watch3_r840x_privilege_offline.py'
      - 'tests/test_watch3_r840x_privilege_offline.py'
      - 'tools/native/watch3_security_metadata.c'
      - 'tests/test_watch3_r840x_security_metadata.py'
      - 'tests/test_watch3_r840x_fota_owner_readonly.py'
      - 'tests/test_watch3_r840x_fota_owner_real_dbus.py'
      - 'tests/test_watch3_r840x_fota_unit_readonly.py'
      - 'tests/test_watch3_r840x_fota_unit_real_systemd.py'
      - 'tools/watch3_r08_root_prereq.py'
      - 'tools/watch3_r08_fota_artifact_pull.py'
      - 'tools/watch3_r08_fota_consumer_inventory.py'
      - 'tools/watch3_r08_fota_manifest_probe.py'
      - 'tools/watch3_r08_fota_package_registration_pull.py'
      - 'tools/watch3_r08_fota_handoff_pull.py'
      - 'tools/watch3_r08_fota_framework_context.py'
      - 'tools/watch3_r08_recovery_script_pull.py'
      - 'tools/analyze_watch3_r08_fota_handoff_offline.py'
      - 'tests/test_watch3_r08_fota_handoff_offline.py'
      - 'tests/test_watch3_r08_recovery_script_pull.py'
      - 'tests/test_watch3_r08_fota_handoff_pull.py'
      - 'tests/test_watch3_r08_fota_framework_context.py'
      - 'tests/test_watch3_r08_fota_package_registration_pull.py'
      - 'tests/test_watch3_r08_fota_manifest_probe.py'
      - 'tests/test_watch3_r08_fota_consumer_inventory.py'
      - 'tools/analyze_watch3_r08_fota_elf.py'
      - 'tests/test_watch3_r08_fota_elf_offline.py'
      - 'tests/test_watch3_r08_fota_artifact_pull.py'
      - 'tests/test_watch3_r08_fota_sync_agent.py'
      - 'tools/watch3_r08_fota_services.py'
      - 'tests/test_watch3_r08_fota_services.py'
      - 'tests/test_watch3_r08_root_prereq.py'
      - 'tests/test_watch3_r08_android_sdb.py'
      - 'docs/watch3-r08-live-boot-evidence.md'
      - '.github/workflows/watch3-r08-android-sdb-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-tizen-watch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install RSA, private D-Bus and ARM ELF fixture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-cryptography dbus clang lld binutils qemu-user
          python3 -c 'import cryptography'

      - name: Test Samsung SDB protocol parser, RSA, fake watch and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          # Disposable host filesystem: reproduce execve(EACCES) from noexec.
          # No physical watch or existing host mount is changed.
          uglyos_noexec_dir=$(mktemp -d /tmp/uglyos-noexec-fixture.XXXXXX)
          trap 'sudo umount "$uglyos_noexec_dir"; rmdir "$uglyos_noexec_dir"' EXIT
          sudo mount -t tmpfs -o noexec,nosuid,nodev,size=1m,mode=1777 tmpfs "$uglyos_noexec_dir"
          export WATCH3_NOEXEC_FIXTURE="$uglyos_noexec_dir"
          python3 -m py_compile tools/watch3_r08_fota_framework_context.py
          python3 -m py_compile tools/watch3_r840x_native_root.py
          python3 -m py_compile tools/watch3_r840x_security_metadata.py tools/watch3_r840x_privilege_offline.py
          python3 -m py_compile tools/watch3_r08_android_sdb.py tools/watch3_r08_root_prereq.py tools/watch3_r08_fota_artifact_pull.py tools/watch3_r08_fota_consumer_inventory.py tools/watch3_r08_fota_manifest_probe.py tools/watch3_r08_fota_package_registration_pull.py tools/watch3_r08_fota_handoff_pull.py tools/watch3_r08_recovery_script_pull.py tools/analyze_watch3_r08_fota_handoff_offline.py tools/watch3_r08_fota_services.py tools/analyze_watch3_r08_fota_elf.py tools/watch3_r840x_fota_owner_readonly.py
          WATCH3_REQUIRE_ARM_ELF=1 python3 - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch
          patterns = [
              'test_watch3_r08_android_sdb.py', 'test_watch3_r08_root_prereq.py',
              'test_watch3_r08_fota_*.py', 'test_watch3_r08_recovery_script_pull.py',
              'test_watch3_r08_live_boot_probe.py',
              'test_watch3_r840x_fota_owner_readonly.py',
              'test_watch3_r840x_fota_unit_readonly.py',
              'test_watch3_r840x_native_root.py',
              'test_watch3_r840x_security_metadata.py',
              'test_watch3_r840x_privilege_offline.py',
          ]
          suite = unittest.TestSuite(unittest.defaultTestLoader.discover('tests', pattern=p)
                                     for p in patterns)
          # Actual older collision fixtures escaped their mock scopes and
          # attempted a connection. Fix those fixtures and fail any future
          # unmocked SDB connection before it can reach a network endpoint.
          with patch.object(socket, 'create_connection',
                            side_effect=AssertionError('Unmocked connection in NO WATCH fixtures')):
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print('PASS: fake SDB suite passed with every unmocked connection rejected')
          PY
          WATCH3_REQUIRE_PRIVATE_DBUS=1 python3 -m unittest discover -s tests -p test_watch3_r840x_fota_owner_real_dbus.py -v
          WATCH3_REQUIRE_SYSTEMD=1 python3 -m unittest discover -s tests -p test_watch3_r840x_fota_unit_real_systemd.py -v
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/watch3-r08-android-sdb-tests.yml').read_text()
          # Only inspect lines actually invoking commands; never match this check.
          executed_python = [line.strip() for line in workflow.splitlines()
                             if line.lstrip().startswith('python tools/')]
          assert all('--watch-ip' not in line for line in executed_python)
          assert 'NO WATCH' in workflow
          print('PASS: fake SDB and disposable host metadata fixtures only; no watch or LAN access')
          PY
