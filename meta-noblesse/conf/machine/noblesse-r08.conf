#@TYPE: Machine
#@NAME: Samsung Galaxy Watch3 SM-R840X (R08) experimental reference
#@DESCRIPTION: Exynos 9110 NOBLESSE-LARGE-BT R08 research machine. NOT boot-validated.

# SoC is AArch64 (2x Cortex-A53). Original Tizen userspace is 32-bit,
# but this experimental OpenEmbedded target uses 64-bit userspace.
# Proprietary 32-bit Tizen graphics/sensor components cannot simply be reused.
require conf/machine/include/arm/armv8a/tune-cortexa53.inc
DEFAULTTUNE = "cortexa53-nocrypto"

MACHINE_FEATURES = "alsa bluetooth wifi ext2"
IMAGE_FSTYPES:append = " ext4"
IMAGE_ROOTFS_ALIGNMENT = "4"

MACHINE_DISPLAY_ROUND = "true"
MACHINE_HAS_WLAN = "true"
# Do not claim working sound, GPU, sensors or charging until measured on-device.
MACHINE_HAS_SPEAKER = "false"
MACHINE_HAS_MICROPHONE = "false"

PREFERRED_PROVIDER_virtual/kernel = "linux-noblesse"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "exynos/exynos9110-tizen_noblesse_large_bt-r08.dtb"

# No bootloader/install/recovery steps are configured: image deployment is blocked.
