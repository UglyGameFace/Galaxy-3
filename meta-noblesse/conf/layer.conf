# Experimental Galaxy Watch3 (SM-R840X) layer, R08 board revision.
# This layer is NOT yet a usable/flashing-capable AsteroidOS port.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "noblesse-layer"
BBFILE_PATTERN_noblesse-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_noblesse-layer = "8"
LAYERSERIES_COMPAT_noblesse-layer = "whinlatter"
